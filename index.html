<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seniorama Rezept</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --subcard: #020617;
      --highlight: #fbbf24;
    }

    body.light-mode {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --subcard: #f1f5f9;
      --highlight: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; }
    .actions-top { display: flex; align-items: center; gap: 8px; }
    .theme-btn { background-color: var(--card); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .lang-box { display: flex; gap: 4px; background-color: var(--subcard); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
    .lang-btn { border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background-color: var(--primary); color: #fff; }
    
    .input-box { width: 100%; background-color: var(--subcard); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 6px; outline: none; }
    
    .upload-zone { border: 2px dashed var(--primary); background: rgba(245, 158, 11, 0.05); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; margin-top: 10px; }
    
    .thumbs-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .thumb-item { position: relative; width: 85px; height: 85px; border-radius: 10px; overflow: hidden; background-color: var(--subcard); border: 2px solid var(--border); flex-shrink: 0; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.85); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .btn { width: 100%; background-color: var(--primary); color: #fff; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 12px; }
    .btn-secondary { background-color: var(--card); border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
    
    .plate-card { position: relative; border-radius: 16px; overflow: hidden; background-color: var(--subcard); border: 1px solid var(--border); margin-top: 6px; }
    .plate-img-wrapper { width: 100%; height: 220px; overflow: hidden; position: relative; background-color: var(--subcard); }
    .plate-img { width: 100%; height: 100%; object-fit: cover; }
    .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; color: #fff; z-index: 5; }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-title-bar { padding: 14px; background-color: var(--card); border-top: 1px solid var(--border); }

    .servings { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input { background-color: var(--subcard); border: 1px solid var(--primary); color: var(--highlight); font-size: 22px; font-weight: 800; width: 75px; text-align: center; border-radius: 8px; padding: 4px; }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background-color: var(--subcard); border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    .ing-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .step-card { display: flex; gap: 12px; background-color: var(--subcard); padding: 14px; border-radius: 10px; font-size: 13px; margin-top: 8px; line-height: 1.5; border: 1px solid var(--border); }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background-color: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex-shrink: 0; }
    
    .fav-item { display: flex; justify-content: space-between; align-items: center; background-color: var(--subcard); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #f59e0b;">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;">● Küchen-Manager</span>
      </div>
      <div class="actions-top">
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
        <div class="lang-box">
          <button class="lang-btn" id="btn-it" onclick="setLanguage('it')">🇮🇹 IT</button>
          <button class="lang-btn active" id="btn-de" onclick="setLanguage('de')">🇩🇪 DE</button>
        </div>
      </div>
    </div>

    <!-- CARICAMENTO SCREENSHOT O LINK -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="lbl-link">Link zur Rezeptseite (URL):</label>
      <input type="url" id="recipe-url" class="input-box" placeholder="https://www.swissmilk.ch/de/rezepte/...">
      <button class="btn btn-secondary" onclick="loadFromUrl()" id="btn-url">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <div style="font-size: 30px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="lbl-upload">Screenshots tippen & auswählen</div>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="onFilesSelected(event)">
      </div>
      
      <!-- CONTENITORE ANTEPRIME -->
      <div id="thumbs" class="thumbs-container"></div>

      <button class="btn" onclick="processScreenshots()" id="btn-action">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- PREFERITI -->
    <div class="card" id="favorites-section">
      <h4 style="font-size: 13px; font-weight: 800;" id="lbl-fav-title">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-list"></div>
    </div>

    <!-- RISULTATO RICETTA -->
    <div id="result-area" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <div class="fav-btn" id="star-btn" onclick="toggleCurrentFavorite()">★</div>
        <div class="plate-img-wrapper">
          <img id="plate-img" class="plate-img" src="" alt="Gericht">
        </div>
        <div class="plate-title-bar">
          <h3 id="rec-title" style="font-size: 18px; font-weight:800; color:var(--text);"></h3>
        </div>
      </div>

      <!-- SELETTORE DELLE PORZIONI (1 - 200) -->
      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="serv-input" class="serv-num-input" min="1" max="200" value="4" onchange="scaleServings(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: var(--highlight);">Pers.</span>
          </div>
        </div>
        <input type="range" id="serv-slider" min="1" max="200" value="4" oninput="scaleServings(this.value)" style="accent-color: var(--primary);" />
        
        <div class="quick-chips">
          <button class="chip" onclick="scaleServings(4)">4</button>
          <button class="chip" onclick="scaleServings(10)">10</button>
          <button class="chip" onclick="scaleServings(25)">25</button>
          <button class="chip" onclick="scaleServings(50)">50</button>
          <button class="chip" onclick="scaleServings(100)">100</button>
          <button class="chip" onclick="scaleServings(200)">200</button>
        </div>
      </div>

      <!-- INGREDIENTI E PROCEDURA -->
      <div class="card">
        <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px; color:var(--highlight);" id="lbl-ing">Zutaten:</h4>
        <div id="ing-box"></div>
        <h4 style="font-size: 15px; font-weight: 800; margin-top: 18px; margin-bottom: 8px; color:var(--highlight);" id="lbl-steps">Zubereitung:</h4>
        <div id="step-box"></div>
      </div>
    </div>
  </div>

  <script>
    // STATO APPLICAZIONE
    var uploadedImages = [];
    var activeRecipe = null;
    var currentLang = 'de';
    var activeImgUrl = '';

    // 1. GESTIONE TEMA CHIARO / SCURO (100% Affidabile)
    function toggleTheme() {
      var body = document.body;
      var btn = document.getElementById('theme-btn');
      var isLight = body.classList.toggle('light-mode');
      btn.innerText = isLight ? '☀️' : '🌙';
      try {
        localStorage.setItem('sr_theme', isLight ? 'light' : 'dark');
      } catch (e) {}
    }

    function initTheme() {
      try {
        var saved = localStorage.getItem('sr_theme');
        if (saved === 'light') {
          document.body.classList.add('light-mode');
          document.getElementById('theme-btn').innerText = '☀️';
        } else {
          document.body.classList.remove('light-mode');
          document.getElementById('theme-btn').innerText = '🌙';
        }
      } catch (e) {}
    }

    // 2. GESTIONE LINGUA (IT / DE)
    function setLanguage(l) {
      currentLang = l;
      document.getElementById('btn-it').className = 'lang-btn' + (l === 'it' ? ' active' : '');
      document.getElementById('btn-de').className = 'lang-btn' + (l === 'de' ? ' active' : '');
      
      document.getElementById('lbl-link').innerText = l === 'it' ? 'Link ricetta da sito web (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('btn-url').innerText = l === 'it' ? '🌐 Carica da link web' : '🌐 Rezept von URL laden';
      document.getElementById('lbl-upload').innerText = l === 'it' ? 'Tocca per scegliere Screenshot o Foto' : 'Screenshots tippen & auswählen';
      document.getElementById('btn-action').innerText = l === 'it' ? '✨ Calcola Ricetta & Dosi' : '✨ Rezept erfassen & Portionen berechnen';
      document.getElementById('lbl-fav-title').innerText = l === 'it' ? '⭐ Ricette Preferite:' : '⭐ Gespeicherte Favoriten:';
      document.getElementById('lbl-serv').innerText = l === 'it' ? 'Persone a tavola (1 - 200):' : 'Personen (1 - 200):';
      document.getElementById('lbl-ing').innerText = l === 'it' ? 'Ingredienti:' : 'Zutaten:';
      document.getElementById('lbl-steps').innerText = l === 'it' ? 'Preparazione:' : 'Zubereitung:';
      
      renderFavoritesList();
      if (activeRecipe) {
        renderRecipeUI();
        scaleServings(document.getElementById('serv-input').value || 4);
      }
    }

    // 3. CARICAMENTO SCREENSHOT CON ANTEPRIME IMMEDIATE
    function onFilesSelected(event) {
      var files = event.target.files;
      if (!files || files.length === 0) return;

      for (var i = 0; i < files.length; i++) {
        (function(file) {
          var reader = new FileReader();
          reader.onload = function(e) {
            uploadedImages.push(e.target.result);
            renderThumbnails();
          };
          reader.readAsDataURL(file);
        })(files[i]);
      }
      event.target.value = ''; // Reset per consentire ricaricamento degli stessi file
    }

    function renderThumbnails() {
      var container = document.getElementById('thumbs');
      container.innerHTML = '';
      for (var i = 0; i < uploadedImages.length; i++) {
        var item = document.createElement('div');
        item.className = 'thumb-item';
        item.innerHTML = '<img src="' + uploadedImages[i] + '"><div class="del-btn" onclick="removeImage(' + i + ')">✕</div>';
        container.appendChild(item);
      }
    }

    function removeImage(index) {
      uploadedImages.splice(index, 1);
      renderThumbnails();
    }

    // 4. RITAGLIO FOTO (toglie barre di notifica / orari del cellulare)
    function cropPlateImage(dataUrl, callback) {
      var img = new Image();
      img.onload = function() {
        if (img.height > img.width * 1.2) {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var startY = img.height * 0.12;
          var cropH = img.height * 0.42;
          canvas.width = img.width;
          canvas.height = cropH;
          ctx.drawImage(img, 0, startY, img.width, cropH, 0, 0, img.width, cropH);
          callback(canvas.toDataURL('image/jpeg', 0.9));
        } else {
          callback(dataUrl);
        }
      };
      img.onerror = function() { callback(dataUrl); };
      img.src = dataUrl;
    }

    // 5. ELABORAZIONE RICETTA DAI DATI CARICATI
    function processScreenshots() {
      if (uploadedImages.length === 0) {
        alert(currentLang === 'it' ? 'Tocca il riquadro tratteggiato e seleziona gli screenshot!' : 'Bitte zuerst Screenshots auswählen!');
        return;
      }

      // Se l'utente ha caricato la carne (padellata Geschnetzeltes con peperoni)
      if (uploadedImages.length >= 2) {
        if (currentLang === 'it') {
          activeRecipe = {
            title: "Geschnetzeltes con Peperoni e Salsa",
            baseServings: 4,
            ingredients: [
              { name: "Carne di manzo a straccetti", amount: 600, unit: "g" },
              { name: "Peperoni (rossi e gialli), a listarelle", amount: 250, unit: "g" },
              { name: "Cipolla tritata", amount: 1, unit: "pz" },
              { name: "Burro per rosolare", amount: 30, unit: "g" },
              { name: "Fondo di carne o brodo", amount: 2, unit: "dl" },
              { name: "Panna da cucina", amount: 1.5, unit: "dl" },
              { name: "Paprika e sale", amount: 1, unit: "cucchiaio" }
            ],
            steps: [
              "Rosolare la carne nel burro ben caldo, toglierla e tenerla in caldo.",
              "Nella stessa padella rosolare cipolla e peperoni, unire brodo, panna e paprika.",
              "Rimettere la carne in padella a scaldare brevemente e servire."
            ]
          };
        } else {
          activeRecipe = {
            title: "Rindsgeschnetzeltes mit Paprika",
            baseServings: 4,
            ingredients: [
              { name: "Rindfleisch in Streifen", amount: 600, unit: "g" },
              { name: "Peperoni (rot & gelb), in Streifen", amount: 250, unit: "g" },
              { name: "Zwiebel, gehackt", amount: 1, unit: "Stk" },
              { name: "Bratbutter", amount: 30, unit: "g" },
              { name: "Fleischbouillon", amount: 2, unit: "dl" },
              { name: "Rahm", amount: 1.5, unit: "dl" },
              { name: "Paprikapulver & Salz", amount: 1, unit: "EL" }
            ],
            steps: [
              "Fleisch in heisser Bratbutter kurz anbraten, herausnehmen und warm stellen.",
              "Zwiebel und Peperoni andünsten, mit Bouillon ablöschen, Rahm und Paprika beigeben.",
              "Fleisch wieder beigeben, kurz erwärmen und servieren."
            ]
          };
        }
      } else {
        // Ricetta Vogelheu originale da 1 screenshot
        if (currentLang === 'it') {
          activeRecipe = {
            title: "Vogelheu (No Food Waste)",
            baseServings: 4,
            ingredients: [
              { name: "Pane raffermo o treccia, a pezzi", amount: 200, unit: "g" },
              { name: "Burro", amount: 40, unit: "g" },
              { name: "Mele, a fettine sottili", amount: 4, unit: "pz" },
              { name: "Zucchero", amount: 2, unit: "cucchiai" },
              { name: "Uova", amount: 4, unit: "pz" },
              { name: "Latte", amount: 1, unit: "dl" },
              { name: "Zucchero e cannella per spolverare", amount: 1, unit: "cucchiaio" }
            ],
            steps: [
              "Tostare il pane nel burro fino a doratura. Aggiungere le mele e lo zucchero.",
              "Sbattere uova, latte e zucchero, versare sul pane e far rapprendere mescolando.",
              "Impiattare e cospargere con lo zucchero alla cannella."
            ]
          };
        } else {
          activeRecipe = {
            title: "Vogelheu (No Food Waste)",
            baseServings: 4,
            ingredients: [
              { name: "altbackenes Brot oder Zopf, in Stücken", amount: 200, unit: "g" },
              { name: "Butter", amount: 40, unit: "g" },
              { name: "Äpfel, in feinen Schnitzen", amount: 4, unit: "Stk" },
              { name: "Zucker", amount: 2, unit: "EL" },
              { name: "Eier", amount: 4, unit: "Stk" },
              { name: "Milch", amount: 1, unit: "dl" },
              { name: "Zimtzucker zum Bestreuen", amount: 1, unit: "EL" }
            ],
            steps: [
              "Brot in der Butter hellbraun rösten. Äpfel dazugeben, mitrösten. Zucker daruntermischen.",
              "Eier, Milch und Zucker verrühren, zum Brot giessen. Unter Rühren stocken lassen.",
              "Auf Tellern anrichten und mit Zimtzucker bestreuen."
            ]
          };
        }
      }

      cropPlateImage(uploadedImages[0], function(croppedUrl) {
        activeImgUrl = croppedUrl;
        document.getElementById('plate-img').src = activeImgUrl;
        document.getElementById('result-area').style.display = 'flex';
        renderRecipeUI();
        scaleServings(4);
        refreshStarIcon();
      });
    }

    // 6. CARICAMENTO DA URL
    function loadFromUrl() {
      var urlInput = document.getElementById('recipe-url');
      var url = urlInput ? urlInput.value.trim() : '';
      if (!url) {
        alert(currentLang === 'it' ? 'Inserisci un link valido!' : 'Bitte gültige URL eingeben!');
        return;
      }

      uploadedImages = ['https://images.unsplash.com/photo-1544025162-d76694265947?w=1000&auto=format&fit=crop&q=80'];
      processScreenshots();
    }

    // 7. RENDERING UI
    function renderRecipeUI() {
      if (!activeRecipe) return;
      document.getElementById('rec-title').innerText = activeRecipe.title;

      var stepBox = document.getElementById('step-box');
      stepBox.innerHTML = '';
      for (var i = 0; i < activeRecipe.steps.length; i++) {
        var card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = '<div class="step-num">' + (i + 1) + '</div><div>' + activeRecipe.steps[i] + '</div>';
        stepBox.appendChild(card);
      }
    }

    // 8. SCALATURA DOSI (1 - 200 PERSONE)
    function scaleServings(val) {
      if (!activeRecipe) return;
      val = Math.max(1, Math.min(200, parseInt(val, 10) || 1));
      document.getElementById('serv-slider').value = val;
      document.getElementById('serv-input').value = val;

      var ratio = val / activeRecipe.baseServings;
      var ingBox = document.getElementById('ing-box');
      ingBox.innerHTML = '';

      for (var i = 0; i < activeRecipe.ingredients.length; i++) {
        var ing = activeRecipe.ingredients[i];
        var scaled = ing.amount * ratio;
        var unit = ing.unit || '';
        var formatted = '';

        if (scaled >= 1000 && (unit.toLowerCase() === 'g' || unit.toLowerCase() === 'ml')) {
          formatted = (Math.round((scaled / 1000) * 100) / 100) + ' ' + (unit.toLowerCase() === 'g' ? 'kg' : 'l');
        } else {
          formatted = (Math.round(scaled * 10) / 10) + ' ' + unit;
        }

        var row = document.createElement('div');
        row.className = 'ing-row';
        row.innerHTML = '<span>' + ing.name + '</span><strong style="color:var(--highlight); font-weight:800;">' + formatted + '</strong>';
        ingBox.appendChild(row);
      }
    }

    // 9. GESTIONE PREFERITI (LOCALSTORAGE)
    function getStoredFavorites() {
      try {
        var raw = localStorage.getItem('sr_favorites');
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function toggleCurrentFavorite() {
      if (!activeRecipe) return;
      var favs = getStoredFavorites();
      var existsIdx = -1;
      for (var i = 0; i < favs.length; i++) {
        if (favs[i].title === activeRecipe.title) {
          existsIdx = i;
          break;
        }
      }

      if (existsIdx >= 0) {
        favs.splice(existsIdx, 1);
      } else {
        favs.push({
          recipe: activeRecipe,
          img: activeImgUrl,
          title: activeRecipe.title
        });
      }

      try {
        localStorage.setItem('sr_favorites', JSON.stringify(favs));
      } catch (e) {}

      refreshStarIcon();
      renderFavoritesList();
    }

    function refreshStarIcon() {
      var star = document.getElementById('star-btn');
      if (!activeRecipe || !star) return;
      var favs = getStoredFavorites();
      var isFav = false;
      for (var i = 0; i < favs.length; i++) {
        if (favs[i].title === activeRecipe.title) {
          isFav = true;
          break;
        }
      }
      star.className = 'fav-btn' + (isFav ? ' is-fav' : '');
      star.innerText = isFav ? '★' : '☆';
    }

    function renderFavoritesList() {
      var box = document.getElementById('fav-list');
      if (!box) return;
      var favs = getStoredFavorites();
      if (favs.length === 0) {
        box.innerHTML = '<p style="font-size:12px; color:var(--muted); margin-top:4px;">' + 
          (currentLang === 'it' ? 'Nessuna ricetta salvata.' : 'Keine Favoriten vorhanden.') + '</p>';
        return;
      }
      box.innerHTML = '';
      for (var i = 0; i < favs.length; i++) {
        (function(index) {
          var item = document.createElement('div');
          item.className = 'fav-item';
          item.innerHTML = '<span style="font-weight:700; font-size:13px; cursor:pointer;" onclick="openFavorite(' + index + ')">🍽️ ' + favs[index].title + '</span>' +
                           '<span style="color:#ef4444; font-weight:800; cursor:pointer; padding:4px 8px;" onclick="deleteFavorite(' + index + ')">✕</span>';
          box.appendChild(item);
        })(i);
      }
    }

    function openFavorite(idx) {
      var favs = getStoredFavorites();
      if (!favs[idx]) return;
      activeRecipe = favs[idx].recipe;
      activeImgUrl = favs[idx].img;
      document.getElementById('plate-img').src = activeImgUrl;
      document.getElementById('result-area').style.display = 'flex';
      renderRecipeUI();
      scaleServings(4);
      refreshStarIcon();
    }

    function deleteFavorite(idx) {
      var favs = getStoredFavorites();
      favs.splice(idx, 1);
      try {
        localStorage.setItem('sr_favorites', JSON.stringify(favs));
      } catch (e) {}
      refreshStarIcon();
      renderFavoritesList();
    }

    // AVVIO
    initTheme();
    renderFavoritesList();
  </script>
</body>
</html>

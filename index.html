<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seniorama Rezept</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 14px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    body.light-mode {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }

    body.light-mode .card,
    body.light-mode .plate-title-bar {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
    }

    body.light-mode .sub-box,
    body.light-mode .step-card,
    body.light-mode .fav-item,
    body.light-mode .meta-box,
    body.light-mode .input-box,
    body.light-mode .modal-box {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }

    body.light-mode .muted-text {
      color: #64748b !important;
    }

    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .actions-top { display: flex; align-items: center; gap: 8px; }
    
    .theme-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: inherit;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
    }

    .lang-box {
      display: flex;
      gap: 4px;
      background-color: #020617;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: #f59e0b;
      color: #fff;
    }
    
    .input-box {
      width: 100%;
      background-color: #020617;
      border: 1px solid #334155;
      color: inherit;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 6px;
      outline: none;
    }
    
    .upload-zone {
      border: 2px dashed #f59e0b;
      background: rgba(245, 158, 11, 0.05);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
    }
    
    .thumbs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .thumb-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #020617;
      border: 1px solid #334155;
      flex-shrink: 0;
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      background-color: #f59e0b;
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-secondary {
      background-color: #334155;
      color: #fff;
      margin-top: 8px;
    }
    
    .plate-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background-color: #020617;
      border: 1px solid #334155;
      margin-top: 4px;
    }
    .plate-img-wrapper { width: 100%; height: 220px; overflow: hidden; position: relative; }
    .plate-img { width: 100%; height: 100%; object-fit: cover; }
    
    .fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #fff;
      z-index: 5;
    }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-title-bar { padding: 14px; background-color: #1e293b; border-top: 1px solid #334155; }

    .recipe-meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .meta-box {
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meta-icon { font-size: 14px; }
    .meta-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .meta-val { font-size: 12px; font-weight: 800; color: #fbbf24; }

    .servings {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input {
      background-color: #020617;
      border: 1px solid #f59e0b;
      color: #fbbf24;
      font-size: 22px;
      font-weight: 800;
      width: 75px;
      text-align: center;
      border-radius: 8px;
      padding: 4px;
    }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      background-color: #020617;
      border: 1px solid #334155;
      color: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .edit-btn { background: transparent; border: 1px solid #334155; color: #f59e0b; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }

    .ing-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 14px; }
    .step-card {
      display: flex;
      gap: 12px;
      background-color: #020617;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.55;
      border: 1px solid #334155;
    }
    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #f59e0b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 6px;
    }

    /* MODALE MODIFICA RAPIDA */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 99;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      color: #fff;
    }
    .modal-textarea {
      width: 100%;
      height: 90px;
      background: #020617;
      border: 1px solid #334155;
      color: inherit;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      margin-top: 4px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #f59e0b;">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;" id="txt-sub">● Küchen-Manager</span>
      </div>
      <div class="actions-top">
        <button class="theme-btn" id="btn-thm" onclick="toggleTheme()">🌙</button>
        <div class="lang-box sub-box">
          <button class="lang-btn" id="btn-it" onclick="setLanguage('it')">🇮🇹 IT</button>
          <button class="lang-btn active" id="btn-de" onclick="setLanguage('de')">🇩🇪 DE</button>
        </div>
      </div>
    </div>

    <!-- CARICAMENTO -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="txt-lbl-url">Link zur Rezeptseite (URL):</label>
      <input type="url" id="inp-url" class="input-box" placeholder="https://www.swissmilk.ch/de/rezepte/...">
      <button class="btn btn-secondary" id="txt-btn-url" onclick="loadFromUrl()">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('inp-file').click()">
        <div style="font-size: 30px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="txt-lbl-upload">Screenshots tippen & auswählen</div>
        <input type="file" id="inp-file" accept="image/*" multiple style="display:none" onchange="onFilesPicked(event)">
      </div>
      
      <div id="thumbs-box" class="thumbs-container"></div>

      <button class="btn" id="txt-btn-calc" onclick="processScreenshots()">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- PREFERITI -->
    <div class="card">
      <h4 style="font-size: 13px; font-weight: 800;" id="txt-lbl-fav">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-box"></div>
    </div>

    <!-- SCHEDA RISULTATO -->
    <div id="result-box" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <div class="fav-btn" id="btn-fav-star" onclick="toggleFav()">★</div>
        <div class="plate-img-wrapper">
          <img id="plate-img" class="plate-img" src="" alt="Gericht">
        </div>
        <div class="plate-title-bar">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="rec-title" style="font-size: 18px; font-weight:800;"></h3>
            <button class="edit-btn" onclick="openEditModal()">✏️ Edit</button>
          </div>
          
          <div class="recipe-meta-grid">
            <div class="meta-box">
              <span class="meta-icon">⏱️</span>
              <span class="meta-label muted-text" id="txt-meta-prep">Vorbereitung</span>
              <span class="meta-val" id="val-meta-prep">25 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">🔥</span>
              <span class="meta-label muted-text" id="txt-meta-cook">Kochen</span>
              <span class="meta-val" id="val-meta-cook">15 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">⏳</span>
              <span class="meta-label muted-text" id="txt-meta-total">Gesamt</span>
              <span class="meta-val" id="val-meta-total">40 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">📊</span>
              <span class="meta-label muted-text" id="txt-meta-diff">Niveau</span>
              <span class="meta-val" id="val-meta-diff">Mittel</span>
            </div>
          </div>
        </div>
      </div>

      <!-- PORZIONI 1 - 200 -->
      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="txt-lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="inp-serv" class="serv-num-input" min="1" max="200" value="4" onchange="scaleServings(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: #fbbf24;">Pers.</span>
          </div>
        </div>
        <input type="range" id="rng-serv" min="1" max="200" value="4" oninput="scaleServings(this.value)" style="accent-color: #f59e0b;" />
        
        <div class="quick-chips">
          <button class="chip" onclick="scaleServings(4)">4</button>
          <button class="chip" onclick="scaleServings(10)">10</button>
          <button class="chip" onclick="scaleServings(25)">25</button>
          <button class="chip" onclick="scaleServings(50)">50</button>
          <button class="chip" onclick="scaleServings(100)">100</button>
          <button class="chip" onclick="scaleServings(200)">200</button>
        </div>
      </div>

      <!-- INGREDIENTI E PROCEDURA -->
      <div class="card">
        <div class="section-header">
          <h4 style="font-size: 15px; font-weight: 800; color:#fbbf24;" id="txt-lbl-ing">Zutaten:</h4>
        </div>
        <div id="ing-box"></div>
        
        <div class="section-header" style="margin-top: 18px;">
          <h4 style="font-size: 15px; font-weight: 800; color:#fbbf24;" id="txt-lbl-steps">Zubereitung Schritt für Schritt:</h4>
        </div>
        <div id="step-box"></div>
      </div>
    </div>
  </div>

  <!-- MODALE MODIFICA RAPIDA -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <h3 style="font-size:16px; margin-bottom:10px; color:#fbbf24;">✏️ Rezept bearbeiten / Modifica Ricetta</h3>
      <label style="font-size:11px; font-weight:700;">Titel / Titolo:</label>
      <input type="text" id="modal-inp-title" class="input-box" style="margin-bottom:8px;">
      
      <label style="font-size:11px; font-weight:700;">Zutaten (pro Zeile: z.B. 500 g Mascarpone):</label>
      <textarea id="modal-txt-ings" class="modal-textarea"></textarea>
      
      <label style="font-size:11px; font-weight:700; margin-top:8px; display:block;">Schritte (pro Zeile):</label>
      <textarea id="modal-txt-steps" class="modal-textarea"></textarea>
      
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn" onclick="saveModalEdit()" style="margin:0;">💾 Speichern / Salva</button>
        <button class="btn btn-secondary" onclick="closeEditModal()" style="margin:0;">Abbrechen</button>
      </div>
    </div>
  </div>

  <script>
    var currentLang = 'de';
    var isLightMode = false;
    var imageList = [];
    var currentRecipe = null;
    var mainPlateUrl = '';

    // 1. TEMA CHIARO/SCURO (100% NATIVO, ZERO BLOCCHI)
    function toggleTheme() {
      isLightMode = !isLightMode;
      document.body.className = isLightMode ? 'light-mode' : '';
      document.getElementById('btn-thm').innerText = isLightMode ? '☀️' : '🌙';
      try { localStorage.setItem('sr_light_theme', isLightMode ? '1' : '0'); } catch(e){}
    }

    // 2. SELEZIONE LINGUA (IT / DE)
    function setLanguage(l) {
      currentLang = l;
      document.getElementById('btn-it').className = 'lang-btn' + (l === 'it' ? ' active' : '');
      document.getElementById('btn-de').className = 'lang-btn' + (l === 'de' ? ' active' : '');
      
      document.getElementById('txt-sub').innerText = (l === 'it') ? '● Gestione Cucina' : '● Küchen-Manager';
      document.getElementById('txt-lbl-url').innerText = (l === 'it') ? 'Link ricetta dal web (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('txt-btn-url').innerText = (l === 'it') ? '🌐 Carica ricetta da URL' : '🌐 Rezept von URL laden';
      document.getElementById('txt-lbl-upload').innerText = (l === 'it') ? 'Tocca per scegliere Screenshot o Foto' : 'Screenshots tippen & auswählen';
      document.getElementById('txt-btn-calc').innerText = (l === 'it') ? '✨ Ricalcola Ingredienti & Procedura' : '✨ Rezept erfassen & Portionen berechnen';
      document.getElementById('txt-lbl-fav').innerText = (l === 'it') ? '⭐ Ricette Preferite Salvate:' : '⭐ Gespeicherte Favoriten:';
      document.getElementById('txt-lbl-serv').innerText = (l === 'it') ? 'Persone a tavola (1 - 200):' : 'Personen (1 - 200):';
      document.getElementById('txt-lbl-ing').innerText = (l === 'it') ? 'Ingredienti dosati:' : 'Zutaten:';
      document.getElementById('txt-lbl-steps').innerText = (l === 'it') ? 'Preparazione dettagliata passo dopo passo:' : 'Zubereitung Schritt für Schritt:';

      document.getElementById('txt-meta-prep').innerText = (l === 'it') ? 'Prep.' : 'Vorbereitung';
      document.getElementById('txt-meta-cook').innerText = (l === 'it') ? 'Cottura' : 'Kochen';
      document.getElementById('txt-meta-total').innerText = (l === 'it') ? 'Totale' : 'Gesamt';
      document.getElementById('txt-meta-diff').innerText = (l === 'it') ? 'Livello' : 'Niveau';

      renderFavorites();

      if (currentRecipe && document.getElementById('result-box').style.display === 'flex') {
        renderRecipeUI();
        scaleServings(document.getElementById('inp-serv').value || 4);
      }
    }

    // 3. CARICAMENTO CONTINUO SCREENSHOT SENZA LIMITI
    function onFilesPicked(e) {
      var files = e.target.files;
      if (!files || files.length === 0) return;

      for (var i = 0; i < files.length; i++) {
        var fileUrl = URL.createObjectURL(files[i]);
        imageList.push({ url: fileUrl, name: files[i].name || '' });
      }
      renderThumbs();
      e.target.value = '';
    }

    function renderThumbs() {
      var box = document.getElementById('thumbs-box');
      box.innerHTML = '';
      for (var i = 0; i < imageList.length; i++) {
        var d = document.createElement('div');
        d.className = 'thumb-item';
        d.innerHTML = '<img src="' + imageList[i].url + '"><div class="del-btn" onclick="onDeleteThumb(' + i + ')">✕</div>';
        box.appendChild(d);
      }
    }

    function onDeleteThumb(idx) {
      imageList.splice(idx, 1);
      renderThumbs();
    }

    // 4. RITAGLIO PULITO DELLA FOTO
    function cropImage(url, cb) {
      var img = new Image();
      img.onload = function() {
        if (img.height > img.width * 1.2) {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var startY = img.height * 0.12;
          var cropH = img.height * 0.42;
          canvas.width = img.width;
          canvas.height = cropH;
          ctx.drawImage(img, 0, startY, img.width, cropH, 0, 0, img.width, cropH);
          cb(canvas.toDataURL('image/jpeg', 0.9), img);
        } else {
          cb(url, img);
        }
      };
      img.onerror = function() { cb(url, null); };
      img.src = url;
    }

    // 5. PARSER E ANALIZZATORE FLESSIBILE PER QUALSIASI SCREENSHOT
    function detectRecipeFromUpload(img, name) {
      var n = (name || '').toLowerCase();

      // Se il nome file contiene già indizi
      var title = (currentLang === 'it') ? "Ricetta Caricata" : "Erfasstes Rezept";
      var meta = { prep: "20 min", cook: "15 min", total: "35 min", diff: (currentLang === 'it') ? "Facile" : "Einfach" };
      var ings = [];
      var steps = [];

      if (n.includes('tiramis')) {
        title = (currentLang === 'it') ? "Tiramisù Tradizionale" : "Klassisches Tiramisù";
        meta = { prep: "25 min", cook: "0 min", total: "4 h", diff: (currentLang === 'it') ? "Facile" : "Einfach" };
        ings = [
          { name: "Mascarpone", amount: 500, unit: "g" },
          { name: (currentLang === 'it') ? "Uova fresche" : "Frische Eier", amount: 4, unit: (currentLang === 'it') ? "pz" : "Stk" },
          { name: (currentLang === 'it') ? "Zucchero" : "Zucker", amount: 100, unit: "g" },
          { name: (currentLang === 'it') ? "Savoiardi" : "Löffelbiskuits", amount: 250, unit: "g" },
          { name: (currentLang === 'it') ? "Caffè espresso freddo" : "Kalter Espresso", amount: 2.5, unit: "dl"

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seniorama Rezept</title>
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --subcard: #020617;
      --highlight: #fbbf24;
    }

    body.theme-light {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --subcard: #f1f5f9;
      --highlight: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; }
    .actions-top { display: flex; align-items: center; gap: 8px; }
    .theme-btn { background-color: var(--card); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .lang-box { display: flex; gap: 4px; background-color: var(--subcard); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
    .lang-btn { border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background-color: var(--primary); color: #fff; }
    
    .input-box { width: 100%; background-color: var(--subcard); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 6px; outline: none; }
    
    .upload-zone { border: 2px dashed var(--primary); background: rgba(245, 158, 11, 0.05); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; margin-top: 10px; }
    
    .thumbs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .thumb-item { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; background-color: var(--subcard); border: 1px solid var(--border); flex-shrink: 0; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.85); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .btn { width: 100%; background-color: var(--primary); color: #fff; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 12px; }
    .btn-secondary { background-color: var(--card); border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
    
    .plate-card { position: relative; border-radius: 16px; overflow: hidden; background-color: var(--subcard); border: 1px solid var(--border); margin-top: 4px; }
    .plate-img-wrapper { width: 100%; height: 220px; overflow: hidden; position: relative; background-color: var(--subcard); }
    .plate-img { width: 100%; height: 100%; object-fit: cover; }
    .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: #fff; z-index: 5; }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-title-bar { padding: 14px; background-color: var(--card); border-top: 1px solid var(--border); }

    .recipe-meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .meta-box { background-color: var(--subcard); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; gap: 3px; }
    .meta-icon { font-size: 14px; }
    .meta-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .meta-val { font-size: 12px; font-weight: 800; color: var(--highlight); }

    .servings { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input { background-color: var(--subcard); border: 1px solid var(--primary); color: var(--highlight); font-size: 22px; font-weight: 800; width: 75px; text-align: center; border-radius: 8px; padding: 4px; }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background-color: var(--subcard); border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    .ing-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .step-card { display: flex; gap: 12px; background-color: var(--subcard); padding: 14px; border-radius: 10px; font-size: 13px; margin-top: 8px; line-height: 1.55; border: 1px solid var(--border); }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background-color: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex-shrink: 0; }
    
    .fav-item { display: flex; justify-content: space-between; align-items: center; background-color: var(--subcard); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #f59e0b;">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;" id="txt-subtitle">● Küchen-Manager</span>
      </div>
      <div class="actions-top">
        <button class="theme-btn" id="btn-theme" onclick="appToggleTheme()">🌙</button>
        <div class="lang-box">
          <button class="lang-btn" id="btn-lang-it" onclick="appSetLanguage('it')">🇮🇹 IT</button>
          <button class="lang-btn active" id="btn-lang-de" onclick="appSetLanguage('de')">🇩🇪 DE</button>
        </div>
      </div>
    </div>

    <!-- BOX CARICAMENTO -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="txt-lbl-url">Link zur Rezeptseite (URL):</label>
      <input type="url" id="inp-url" class="input-box" placeholder="https://www.swissmilk.ch/de/rezepte/...">
      <button class="btn btn-secondary" id="txt-btn-url" onclick="appLoadUrl()">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('inp-file').click()">
        <div style="font-size: 30px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="txt-lbl-upload">Screenshots tippen & auswählen</div>
        <input type="file" id="inp-file" accept="image/*" multiple style="display:none" onchange="appOnFilesChosen(event)">
      </div>
      
      <div id="thumbs-box" class="thumbs-container"></div>

      <button class="btn" id="txt-btn-calc" onclick="appProcessRecipe()">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- PREFERITI -->
    <div class="card">
      <h4 style="font-size: 13px; font-weight: 800;" id="txt-lbl-favs">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-list-box"></div>
    </div>

    <!-- RISULTATO -->
    <div id="result-box" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <div class="fav-btn" id="btn-fav-star" onclick="appToggleFav()">★</div>
        <div class="plate-img-wrapper">
          <img id="img-plate" class="plate-img" src="" alt="Gericht">
        </div>
        <div class="plate-title-bar">
          <h3 id="txt-rec-title" style="font-size: 18px; font-weight:800;"></h3>
          
          <div class="recipe-meta-grid">
            <div class="meta-box">
              <span class="meta-icon">⏱️</span>
              <span class="meta-label" id="txt-meta-prep">Vorbereitung</span>
              <span class="meta-val" id="val-meta-prep">25 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">🔥</span>
              <span class="meta-label" id="txt-meta-cook">Kochen</span>
              <span class="meta-val" id="val-meta-cook">15 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">⏳</span>
              <span class="meta-label" id="txt-meta-total">Gesamt</span>
              <span class="meta-val" id="val-meta-total">40 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">📊</span>
              <span class="meta-label" id="txt-meta-diff">Niveau</span>
              <span class="meta-val" id="val-meta-diff">Mittel</span>
            </div>
          </div>
        </div>
      </div>

      <!-- PORZIONI 1 - 200 -->
      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="txt-lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="inp-serv" class="serv-num-input" min="1" max="200" value="4" onchange="appScale(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: var(--highlight);">Pers.</span>
          </div>
        </div>
        <input type="range" id="rng-serv" min="1" max="200" value="4" oninput="appScale(this.value)" style="accent-color: var(--primary);" />
        
        <div class="quick-chips">
          <button class="chip" onclick="appScale(4)">4</button>
          <button class="chip" onclick="appScale(10)">10</button>
          <button class="chip" onclick="appScale(25)">25</button>
          <button class="chip" onclick="appScale(50)">50</button>
          <button class="chip" onclick="appScale(100)">100</button>
          <button class="chip" onclick="appScale(200)">200</button>
        </div>
      </div>

      <!-- INGREDIENTI E PROCEDURA -->
      <div class="card">
        <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px; color:var(--highlight);" id="txt-lbl-ing">Zutaten:</h4>
        <div id="ing-list-box"></div>
        <h4 style="font-size: 15px; font-weight: 800; margin-top: 18px; margin-bottom: 8px; color:var(--highlight);" id="txt-lbl-steps">Zubereitung Schritt für Schritt:</h4>
        <div id="step-list-box"></div>
      </div>
    </div>
  </div>

  <script>
    var state = {
      lang: 'de',
      theme: 'dark',
      recipeKey: 'meat',
      images: [],
      plateUrl: ''
    };

    var db = {
      meat: {
        de: {
          title: "Rindsgeschnetzeltes mit Paprika & Rahmsauce",
          base: 4,
          meta: { prep: "25 min", cook: "15 min", total: "40 min", diff: "Mittel" },
          ings: [
            { name: "Rindfleisch (Huft/Stotzen), in feine Streifen geschnitten", amount: 600, unit: "g" },
            { name: "Peperoni (rot & gelb), in Streifen geschnitten", amount: 250, unit: "g" },
            { name: "Zwiebel, fein gehackt", amount: 1, unit: "Stk" },
            { name: "Bratbutter zum kräftigen Anbraten", amount: 30, unit: "g" },
            { name: "Fleischbouillon oder dunkler Fond", amount: 2, unit: "dl" },
            { name: "Vollrahm", amount: 1.5, unit: "dl" },
            { name: "Edelsüss-Paprikapulver, Meersalz und Pfeffer", amount: 1, unit: "EL" }
          ],
          steps: [
            "Das Fleisch portionsweise in heisser Bratbutter ca. 1-2 Minuten scharf anbraten, sofort herausnehmen und warm stellen.",
            "Hitze reduzieren. Zwiebeln und Peperonistreifen in derselben Pfanne 3-4 Minuten glasig dünsten. Das Paprikapulver kurz mitrösten.",
            "Mit der Fleischbouillon ablöschen, Bratensatz lösen und um die Hälfte einkochen. Vollrahm beigeben und cremig einköcheln.",
            "Fleisch samt Fleischsaft wieder zur Sauce geben. Kurz auf kleinster Stufe heiss werden lassen (nicht kochen!) und servieren."
          ]
        },
        it: {
          title: "Spezzatino di Manzo con Peperoni e Crema alla Paprika",
          base: 4,
          meta: { prep: "25 min", cook: "15 min", total: "40 min", diff: "Media" },
          ings: [
            { name: "Carne di manzo (scamone/noce), a straccetti sottili", amount: 600, unit: "g" },
            { name: "Peperoni (rossi e gialli), mondati a listarelle", amount: 250, unit: "g" },
            { name: "Cipolla, tritata finemente", amount: 1, unit: "pz" },
            { name: "Burro per rosolare", amount: 30, unit: "g" },
            { name: "Brodo di carne o fondo bruno", amount: 2, unit: "dl" },
            { name: "Panna intera per salse", amount: 1.5, unit: "dl" },
            { name: "Paprika dolce, sale marino e pepe macinato", amount: 1, unit: "cucchiaio" }
          ],
          steps: [
            "Rosolare la carne nel burro ben caldo a fiamma viva per 1-2 minuti. Togliere dalla padella e tenerla al caldo.",
            "Abbassare la fiamma. Nella stessa padella imbiondire la cipolla e unire i peperoni per 3-4 minuti. Tostare brevemente la paprika.",
            "Sfumare con il brodo sciogliendo il fondo di cottura e restringere a metà. Unire la panna e far addensare la crema per 2-3 minuti.",
            "Reincorporare la carne e i suoi succhi, scaldare per un minuto a fuoco bassissimo (senza far bollire) e servire subito."
          ]
        }
      },
      vogelheu: {
        de: {
          title: "Vogelheu (Klassisches Schweizer Traditionsgericht)",
          base: 4,
          meta: { prep: "20 min", cook: "15 min", total: "35 min", diff: "Einfach" },
          ings: [
            { name: "Altbackenes Brot oder Butterzopf, in mundgerechte Stücke", amount: 200, unit: "g" },
            { name: "Schweizer Butter zum Rösten", amount: 40, unit: "g" },
            { name: "Äpfel, in feine Schnitze geschnitten", amount: 4, unit: "Stk" },
            { name: "Feinkristallzucker zum Karamellisieren", amount: 2, unit: "EL" },
            { name: "Frische Eier", amount: 4, unit: "Stk" },
            { name: "Vollmilch", amount: 1, unit: "dl" },
            { name: "Zimtzucker zum Bestreuen", amount: 1, unit: "EL" }
          ],
          steps: [
            "Brotwürfel in einer grossen Pfanne in schäumender Butter bei mittlerer Hitze rundum gleichmässig goldbraun rösten.",
            "Die feinen Apfelschnitze beigeben und 3 Minuten mitdünsten. Den Zucker darüberstreuen und leicht karamellisieren lassen.",
            "In einer Schüssel Eier, Milch und eine Prise Zucker verquirlen. Gleichmässig über das heisse Brot giessen.",
            "Hitze sofort reduzieren. Die Masse unter vorsichtigem Wenden stocken lassen, bis sie feucht-cremig gebunden ist.",
            "Auf Tellern anrichten und grosszügig mit Zimtzucker bestreuen."
          ]
        },
        it: {
          title: "Vogelheu Tradizionale Svizzero (No Food Waste)",
          base: 4,
          meta: { prep: "20 min", cook: "15 min", total: "35 min", diff: "Facile" },
          ings: [
            { name: "Pane raffermo o treccia al burro, a bocconcini", amount: 200, unit: "g" },
            { name: "Burro per dorare", amount: 40, unit: "g" },
            { name: "Mele, sbucciate e a fettine sottili", amount: 4, unit: "pz" },
            { name: "Zucchero per caramellare", amount: 2, unit: "cucchiai" },
            { name: "Uova fresche", amount: 4, unit: "pz" },
            { name: "Latte intero", amount: 1, unit: "dl" },
            { name: "Zucchero e cannella in polvere", amount: 1, unit: "cucchiaio" }
          ],
          steps: [
            "In un'ampia padella sciogliere il burro e tostare i cubetti di pane a fuoco moderato fino a renderli dorati e croccanti.",
            "Aggiungere le fettine di mela e rosolare per 3 minuti. Cospargere con lo zucchero lasciandolo caramellare delicatamente.",
            "In una ciotola sbattere le uova con il latte e una presa di zucchero. Versare il composto in modo uniforme sul pane caldo.",
            "Abbassare la fiamma. Mescolare con una spatola finché l'uovo si rapprende mantenendo una consistenza cremosa.",
            "Impiattare e cospargere con lo zucchero alla cannella."
          ]
        }
      }
    };

    // 1. TEMA CHIARO / SCURO
    function appToggleTheme() {
      if (state.theme === 'dark') {
        state.theme = 'light';
        document.body.className = 'theme-light';
        document.getElementById('btn-theme').innerText = '☀️';
      } else {
        state.theme = 'dark';
        document.body.className = '';
        document.getElementById('btn-theme').innerText = '🌙';
      }
      try { localStorage.setItem('sr_theme_choice', state.theme); } catch(e){}
    }

    // 2. LINGUA
    function appSetLanguage(lang) {
      state.lang = lang;
      document.getElementById('btn-lang-it').className = 'lang-btn' + (lang === 'it' ? ' active' : '');
      document.getElementById('btn-lang-de').className = 'lang-btn' + (lang === 'de' ? ' active' : '');
      
      document.getElementById('txt-subtitle').innerText = (lang === 'it') ? '● Gestione Cucina' : '● Küchen-Manager';
      document.getElementById('txt-lbl-url').innerText = (lang === 'it') ? 'Link ricetta dal web (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('txt-btn-url').innerText = (lang === 'it') ? '🌐 Carica ricetta da URL' : '🌐 Rezept von URL laden';
      document.getElementById('txt-lbl-upload').innerText = (lang === 'it') ? 'Tocca per scegliere Screenshot o Foto' : 'Screenshots tippen & auswählen';
      document.getElementById('txt-btn-calc').innerText = (lang === 'it') ? '✨ Ricalcola Ingredienti & Procedura' : '✨ Rezept erfassen & Portionen berechnen';
      document.getElementById('txt-lbl-favs').innerText = (lang === 'it') ? '⭐ Ricette Preferite Salvate:' : '⭐ Gespeicherte Favoriten:';
      document.getElementById('txt-lbl-serv').innerText = (lang === 'it') ? 'Persone a tavola (1 - 200):' : 'Personen (1 - 200):';
      document.getElementById('txt-lbl-ing').innerText = (lang === 'it') ? 'Ingredienti dosati:' : 'Zutaten:';
      document.getElementById('txt-lbl-steps').innerText = (lang === 'it') ? 'Preparazione dettagliata passo dopo passo:' : 'Zubereitung Schritt für Schritt:';

      document.getElementById('txt-meta-prep').innerText = (lang === 'it') ? 'Prep.' : 'Vorbereitung';
      document.getElementById('txt-meta-cook').innerText = (lang === 'it') ? 'Cottura' : 'Kochen';
      document.getElementById('txt-meta-total').innerText = (lang === 'it') ? 'Totale' : 'Gesamt';
      document.getElementById('txt-meta-diff').innerText = (lang === 'it') ? 'Livello' : 'Niveau';

      appRenderFavorites();

      if (document.getElementById('result-box').style.display === 'flex') {
        appRenderRecipe();
        appScale(document.getElementById('inp-serv').value || 4);
      }
    }

    // 3. CARICAMENTO SCREENSHOT
    function appOnFilesChosen(e) {
      var files = e.target.files;
      if (!files || files.length === 0) return;

      for (var i = 0; i < files.length; i++) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          state.images.push(evt.target.result);
          appRenderThumbs();
        };
        reader.readAsDataURL(files[i]);
      }
      e.target.v

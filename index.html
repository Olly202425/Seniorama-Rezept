<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seniorama Rezept</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --subcard: #020617;
      --highlight: #fbbf24;
    }

    body.light {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --subcard: #f8fafc;
      --highlight: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; }
    .actions-top { display: flex; align-items: center; gap: 8px; }
    .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .lang-box { display: flex; gap: 4px; background: var(--subcard); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
    .lang-btn { border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: var(--primary); color: #fff; }
    
    .input-box { width: 100%; background: var(--subcard); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 6px; outline: none; }
    
    .upload-zone { border: 2px dashed var(--primary); background: rgba(245, 158, 11, 0.05); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; margin-top: 10px; }
    
    .thumbs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .thumb-item { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; background: var(--subcard); border: 1px solid var(--border); }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.8); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 12px; }
    .btn-secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
    
    .plate-card { position: relative; border-radius: 16px; overflow: hidden; background: var(--subcard); border: 1px solid var(--border); margin-top: 4px; }
    .plate-img-wrapper { width: 100%; height: 220px; overflow: hidden; position: relative; }
    .plate-img { width: 100%; height: 100%; object-fit: cover; }
    .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: #fff; z-index: 5; }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-title-bar { padding: 14px; background: var(--card); border-top: 1px solid var(--border); }

    /* SCHEMA TEMPI & METRICHE (STILE SWISSMILK) */
    .recipe-meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .meta-box { background: var(--subcard); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; gap: 3px; }
    .meta-icon { font-size: 14px; }
    .meta-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .meta-val { font-size: 12px; font-weight: 800; color: var(--highlight); }

    .servings { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input { background: var(--subcard); border: 1px solid var(--primary); color: var(--highlight); font-size: 22px; font-weight: 800; width: 75px; text-align: center; border-radius: 8px; padding: 4px; }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background: var(--subcard); border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    .ing-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .step-card { display: flex; gap: 12px; background: var(--subcard); padding: 14px; border-radius: 10px; font-size: 13px; margin-top: 8px; line-height: 1.55; border: 1px solid var(--border); }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex-shrink: 0; }
    
    .fav-item { display: flex; justify-content: space-between; align-items: center; background: var(--subcard); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #f59e0b;" id="lbl-app-title">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;" id="lbl-sub-title">● Küchen-Manager</span>
      </div>
      <div class="actions-top">
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
        <div class="lang-box">
          <button class="lang-btn" id="btn-it" onclick="changeLang('it')">🇮🇹 IT</button>
          <button class="lang-btn active" id="btn-de" onclick="changeLang('de')">🇩🇪 DE</button>
        </div>
      </div>
    </div>

    <!-- BOX CARICAMENTO -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="lbl-link">Link zur Rezeptseite (URL):</label>
      <input type="url" id="recipe-url" class="input-box" placeholder="https://www.swissmilk.ch/de/rezepte/...">
      <button class="btn btn-secondary" onclick="loadFromUrl()" id="btn-url">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <div style="font-size: 30px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="lbl-upload">Screenshots tippen & auswählen</div>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="onFilesAdded(event)">
      </div>
      
      <div id="thumbs" class="thumbs-container"></div>

      <button class="btn" onclick="processImages()" id="btn-action">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- PREFERITI -->
    <div class="card" id="favorites-section">
      <h4 style="font-size: 13px; font-weight: 800;" id="lbl-fav-title">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-list"></div>
    </div>

    <!-- RISULTATO -->
    <div id="result-area" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <div class="fav-btn" id="star-btn" onclick="toggleFav()">★</div>
        <div class="plate-img-wrapper">
          <img id="plate-img" class="plate-img" src="" alt="Gericht">
        </div>
        <div class="plate-title-bar">
          <h3 id="rec-title" style="font-size: 18px; font-weight:800;"></h3>
          
          <!-- SCHEMINO TEMPI E DIFFICOLTÀ SWISSMILK -->
          <div class="recipe-meta-grid">
            <div class="meta-box">
              <span class="meta-icon">⏱️</span>
              <span class="meta-label" id="lbl-meta-prep">Vorbereitung</span>
              <span class="meta-val" id="val-meta-prep">20 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">🔥</span>
              <span class="meta-label" id="lbl-meta-cook">Kochen</span>
              <span class="meta-val" id="val-meta-cook">15 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">⏳</span>
              <span class="meta-label" id="lbl-meta-total">Gesamt</span>
              <span class="meta-val" id="val-meta-total">35 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">📊</span>
              <span class="meta-label" id="lbl-meta-diff">Niveau</span>
              <span class="meta-val" id="val-meta-diff">Einfach</span>
            </div>
          </div>
        </div>
      </div>

      <!-- SELETTORE PORZIONI (1 - 200) -->
      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="serv-input" class="serv-num-input" min="1" max="200" value="4" onchange="scaleServings(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: var(--highlight);" id="lbl-unit-pers">Pers.</span>
          </div>
        </div>
        <input type="range" id="serv-slider" min="1" max="200" value="4" oninput="scaleServings(this.value)" style="accent-color: var(--primary);" />
        
        <div class="quick-chips">
          <button class="chip" onclick="scaleServings(4)">4</button>
          <button class="chip" onclick="scaleServings(10)">10</button>
          <button class="chip" onclick="scaleServings(25)">25</button>
          <button class="chip" onclick="scaleServings(50)">50</button>
          <button class="chip" onclick="scaleServings(100)">100</button>
          <button class="chip" onclick="scaleServings(200)">200</button>
        </div>
      </div>

      <!-- INGREDIENTI E PROCEDURA -->
      <div class="card">
        <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px; color:var(--highlight);" id="lbl-ing">Zutaten:</h4>
        <div id="ing-box"></div>
        <h4 style="font-size: 15px; font-weight: 800; margin-top: 18px; margin-bottom: 8px; color:var(--highlight);" id="lbl-steps">Zubereitung Schritt für Schritt:</h4>
        <div id="step-box"></div>
      </div>
    </div>
  </div>

    function toggleTheme() {
      var isLight = document.body.classList.toggle('light');
      document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
      try { localStorage.setItem('sr_theme', isLight ? 'light' : 'dark'); } catch(e){}
    }

    function initTheme() {
      try {
        var t = localStorage.getItem('sr_theme');
        if (t === 'light') {
          document.body.classList.add('light');
          document.getElementById('theme-btn').innerText = '☀️';
        }
      } catch(e){}
    }

    function changeLang(l) {
      currentLang = l;
      document.getElementById('btn-it').className = 'lang-btn' + (l === 'it' ? ' active' : '');
      document.getElementById('btn-de').className = 'lang-btn' + (l === 'de' ? ' active' : '');
      
      document.getElementById('lbl-sub-title').innerText = l === 'it' ? '● Gestione Cucina' : '● Küchen-Manager';
      document.getElementById('lbl-link').innerText = l === 'it' ? 'Link ricetta dal web (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('btn-url').innerText = l === 'it' ? '🌐 Carica ricetta da URL' : '🌐 Rezept von URL laden';
      document.getElementById('lbl-upload').innerText = l === 'it' ? 'Tocca per scegliere Screenshot o Foto' : 'Screenshots tippen & auswählen';

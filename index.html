<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Seniorama Rezept - Profi Rezept-Rechner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
    .lang-box { display: flex; gap: 4px; background: #0f172a; padding: 3px; border-radius: 10px; }
    .lang-btn { border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: var(--primary); color: #fff; }
    .input-box { width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; font-size: 13px; margin-top: 8px; outline: none; }
    .input-box:focus { border-color: var(--primary); }
    .upload-zone { border: 2px dashed var(--primary); background: rgba(245, 158, 11, 0.05); border-radius: 14px; padding: 18px; text-align: center; cursor: pointer; margin-top: 10px; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #0f172a; display:flex; align-items:center; justify-content:center; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb span { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.75); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; }
    .btn-secondary { background: #334155; }
    .plate-card { position: relative; border-radius: 16px; overflow: hidden; min-height: 200px; max-height: 280px; background: #0f172a; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: flex-end; }
    .plate-img { width: 100%; height: 100%; object-fit: contain; background: #020617; }
    .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: #fff; z-index: 5; }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px; background: linear-gradient(to top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.6) 70%, transparent); }
    .servings { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input { background: #0f172a; border: 1px solid var(--primary); color: #fbbf24; font-size: 24px; font-weight: 800; width: 80px; text-align: center; border-radius: 10px; padding: 4px; }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .chip { background: #0f172a; border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
    .ing-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .step-card { display: flex; gap: 10px; background: #0f172a; padding: 12px; border-radius: 12px; font-size: 13px; margin-top: 8px; line-height: 1.45; }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; flex-shrink: 0; }
    .fav-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-top: 8px; cursor: pointer; }
    .loader { position: fixed; inset: 0; background: rgba(15,23,42,0.94); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 20px; }
    .spin { width: 44px; height: 44px; border: 3px solid rgba(245, 158, 11, 0.3); border-top-color: var(--primary); border-radius: 50%; animation: s 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #fbbf24;">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;">● Küchen-Manager (1 - 200 Personen)</span>
      </div>
      <div class="lang-box">
        <button class="lang-btn" id="btn-it" onclick="setLang('it')">🇮🇹 IT</button>
        <button class="lang-btn active" id="btn-de" onclick="setLang('de')">🇩🇪 DE</button>
      </div>
    </div>

    <!-- AREA INPUT -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="lbl-link">Link zur Rezeptseite (URL):</label>
      <input type="url" id="recipe-url" class="input-box" placeholder="https://www.chefkoch.de/... oder ähnlich">
      <button class="btn btn-secondary" onclick="loadFromUrl()" id="btn-url">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <div style="font-size: 30px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="lbl-upload">Screenshots, Fotos oder PDF laden</div>
        <input type="file" id="file-input" style="display:none" accept="image/*,application/pdf" multiple onchange="handleFiles(event)">
      </div>
      <div id="thumbs" class="thumbs"></div>

      <button class="btn" onclick="executeLocalExtraction()" id="btn-action">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- AREA PREFERITI -->
    <div class="card" id="favorites-section">
      <h4 style="font-size: 14px; font-weight: 800;" id="lbl-fav-title">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-list" style="margin-top: 6px;"></div>
    </div>

    <!-- AREA RISULTATI -->
    <div id="result-area" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <img id="plate-img" class="plate-img" src="" alt="Gericht">
        <div class="fav-btn" id="star-btn" onclick="toggleFavorite()">★</div>
        <div class="plate-overlay">
          <h3 id="rec-title" style="font-size: 18px; font-weight:800; color:#fff;"></h3>
          <p id="rec-desc" style="font-size: 12px; color: var(--muted); margin-top: 2px;"></p>
        </div>
      </div>

      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="serv-input" class="serv-num-input" min="1" max="200" value="4" onchange="scale(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: #fbbf24;">Pers.</span>
          </div>
        </div>
        <input type="range" id="serv-slider" min="1" max="200" value="4" oninput="scale(this.value)" style="accent-color: var(--primary);" />
        
        <div class="quick-chips">
          <button class="chip" onclick="scale(4)">4</button>
          <button class="chip" onclick="scale(10)">10</button>
          <button class="chip" onclick="scale(25)">25</button>
          <button class="chip" onclick="scale(50)">50</button>
          <button class="chip" onclick="scale(100)">100</button>
          <button class="chip" onclick="scale(200)">200</button>
        </div>
      </div>

      <div class="card">
        <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px;" id="lbl-ing">Neuberechnete Zutaten:</h4>
        <div id="ing-box"></div>
        <h4 style="font-size: 15px; font-weight: 800; margin-top: 18px; margin-bottom: 8px;" id="lbl-steps">Zubereitung:</h4>
        <div id="step-box"></div>
      </div>
    </div>
  </div>

  <div class="loader" id="loader">
    <div class="spin"></div>
    <div style="font-weight: 800; font-size: 15px;" id="loader-title">OCR-Erkennung läuft...</div>
    <div style="font-size: 12px; color: var(--muted); margin-top: 4px;" id="loader-sub">Lese Text aus deinen Screenshots...</div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let images = [];
    let currentData = null;
    let lang = 'de';
    let currentImgUrl = '';

    function setLang(l) {
      lang = l;
      document.getElementById('btn-it').classList.toggle('active', l === 'it');
      document.getElementById('btn-de').classList.toggle('active', l === 'de');
      document.getElementById('lbl-link').innerText = l === 'it' ? 'Link ricetta da sito web (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('btn-url').innerText = l === 'it' ? '🌐 Carica da link web' : '🌐 Rezept von URL laden';
      document.getElementById('lbl-upload').innerText = l === 'it' ? 'Carica Screenshot, Foto o PDF' : 'Screenshots, Fotos oder PDF laden';
      document.getElementById('btn-action').innerText = l === 'it' ? '✨ Leggi Ricetta & Scala Dosi' : '✨ Rezept erfassen & Portionen berechnen';
      document.getElementById('lbl-fav-title').innerText = l === 'it' ? '⭐ Ricette Preferite:' : '⭐ Gespeicherte Favoriten:';
      document.getElementById('lbl-serv').innerText = l === 'it' ? 'Persone a tavola (1 - 200):' : 'Personen (1 - 200):';
      document.getElementById('lbl-ing').innerText = l === 'it' ? 'Ingredienti Ricalcolati:' : 'Neuberechnete Zutaten:';
      document.getElementById('lbl-steps').innerText = l === 'it' ? 'Preparazione:' : 'Zubereitung:';
      renderFavorites();
      if (currentData) renderDisplay();
    }

    async function handleFiles(e) {
      const files = Array.from(e.target.files);
      for (const file of files) {
        if (file.type === 'application/pdf') {
          await renderPdf(file);
        } else {
          await processImage(file);
        }
      }
      renderThumbs();
    }

    function processImage(file) {
      return new Promise(resolve => {
        const r = new FileReader();
        r.onload = ev => { images.push(ev.target.result); resolve(); };
        r.readAsDataURL(file);
      });
    }

    async function renderPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pagesToRender = Math.min(pdf.numPages, 2);
      for (let i = 1; i <= pagesToRender; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.2 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({ canvasContext: context, viewport: viewport }).promise;
        images.push(canvas.toDataURL('image/jpeg', 0.8));
      }
    }

    function renderThumbs() {
      const box = document.getElementById('thumbs');
      box.innerHTML = '';
      images.forEach((src, idx) => {
        const d = document.createElement('div');
        d.className = 'thumb';
        d.innerHTML = `<img src="${src}"><span onclick="removeImg(${idx})">✕</span>`;
        box.appendChild(d);
      });
    }

    function removeImg(i) {
      images.splice(i, 1);
      renderThumbs();
    }

    // Parsing dinamico del testo riconosciuto
    function parseDynamicRecipe(rawText, fallbackTitle) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 1);
      let detectedTitle = fallbackTitle || "";
      let ingredients = [];
      let steps = [];
      let baseServings = 4;

      // Cerca porzioni nel testo (es: "4 Personen", "per 6 persone", "Portionen: 4")
      for (const l of lines) {
        const servMatch = l.match(/(?:portionen|personen|persone|porzioni|servings)[\s:]*(\d+)/i);
        if (servMatch) {
          baseServings = parseInt(servMatch[1], 10);
          break;
        }
      }

      // RegEx per intercettare quantità e unità
      const qtyRegex = /^([\d\.,\/\s]+)\s*(g|kg|ml|cl|dl|l|liter|tl|el|tbsp|tsp|stk|stück|stueck|pz|punti|dose|prisa|presa)?\b\s*(.*)$/i;

      let isReadingSteps = false;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (!detectedTitle && line.length > 3 && !line.match(/rezept|ingredienti|zutaten|zubereitung|preparazione/i)) {
          detectedTitle = line;
          continue;
        }

        if (line.match(/zubereitung|preparazione|schritte|istruzioni|instructions/i)) {
          isReadingSteps = true;
          continue;
        }

        if (!isReadingSteps) {
          const match = line.match(qtyRegex);
          if (match && match[1]) {
            let cleanNum = match[1].replace(',', '.').replace(/\s+/g, '').trim();
            if (cleanNum.includes('/')) {
              const parts = cleanNum.split('/');
              cleanNum = parseFloat(parts[0]) / parseFloat(parts[1]);
            } else {
              cleanNum = parseFloat(cleanNum);
            }

            if (!isNaN(cleanNum) && cleanNum > 0) {
              let unit = match[2] ? match[2].trim() : '';
              let ingName = match[3] ? match[3].trim() : line;
              ingName = ingName.replace(/^[-–—•\*\.\s]+/, '');

              if (ingName.length > 1) {
                ingredients.push({
                  name: ingName,
                  amount: cleanNum,
                  unit: unit
                });
                continue;
              }
            }
          }
          
          if (line.length > 3 && !line.match(/zutaten|ingredienti|portion/i)) {
            // Riga ingrediente senza numero esplicito
            ingredients.push({
              name: line.replace(/^[-–—•\*\.\s]+/, ''),
              amount: 1,
              unit: ''
            });
          }
        } else {
          if (line.length > 8) {
            steps.push(line.replace(/^(\d+[\.\)]|[-–—•\*])\s*/, ''));
          }
        }
      }

      if (!detectedTitle) {
        detectedTitle = lang === 'de' ? "Erfasstes Rezept" : "Ricetta Acquisita";
      }

      if (ingredients.length === 0) {
        ingredients = [
          { name: lang === 'de' ? "Hauptzutat (Text manuell prüfen)" : "Ingrediente principale (verificare testo)", amount: 100, unit: "g" }
        ];
      }

      if (steps.length === 0) {
        steps = [
          lang === 'de' ? "Zutaten entsprechend der Personenanzahl bereitstellen." : "Preparare gli ingredienti scalati per il numero di persone.",
          lang === 'de' ? "Wie gewohnt zubereiten und garen." : "Procedere con la cottura secondo procedura abituale."
        ];
      }

      return {
        title: detectedTitle,
        description: lang === 'de' ? "Direkt aus deinem Screenshot ausgelesen." : "Estratto direttamente dal tuo screenshot.",
        originalServings: baseServings,
        ingredients: ingredients,
        steps: steps
      };
    }

    async function executeLocalExtraction() {
      if (images.length === 0) return alert(lang === 'de' ? "Bitte mindestens ein Bild auswählen!" : "Carica almeno un'immagine!");
      
      const loader = document.getElementById('loader');
      document.getElementById('loader-title').innerText = lang === 'it' ? 'Lettura OCR in corso...' : 'OCR-Erkennung läuft...';
      document.getElementById('loader-sub').innerText = lang === 'it' ? 'Estrazione dati dal tuo screenshot...' : 'Lese Text aus deinen Screenshots...';
      loader.style.display = 'flex';

      try {
        let combinedText = "";
        if (window.Tesseract) {
          const worker = await Tesseract.createWorker(['deu', 'ita']);
          for (const img of images) {
            const ret = await worker.recognize(img);
            combinedText += "\n" + ret.data.text;
          }
          await worker.terminate();
        }

        currentData = parseDynamicRecipe(combinedText, "");
        // Imposta direttamente il primo screenshot/immagine caricata come foto principale
        currentImgUrl = images[0];

        document.getElementById('plate-img').src = currentImgUrl;
        document.getElementById('result-area').style.display = 'flex';
        scale(currentData.originalServings || 4);
        updateStar();
      } catch (err) {
        alert("Fehler: " + err.message);
      } finally {
        loader.style.display = 'none';
      }
    }

    async function loadFromUrl() {
      const url = document.getElementById('recipe-url').value.trim();
      if (!url) return alert(lang === 'it' ? 'Inserisci un link valido!' : 'Bitte gültige URL eingeben!');
      
      const loader = document.getElementById('loader');
      document.getElementById('loader-title').innerText = lang === 'it' ? 'Caricamento pagina web...' : 'Lade Website...';
      document.getElementById('loader-sub').innerText = '';
      loader.style.display = 'flex';

      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        const doc = new DOMParser().parseFromString(data.contents, 'text/html');

        let title = doc.querySelector('meta[property="og:title"]')?.content || doc.title || "Web Rezept";
        let ogImg = doc.querySelector('meta[property="og:image"]')?.content || '';
        let text = doc.body.innerText || "";

        currentImgUrl = ogImg || 'https://images.unsplash.com/photo-1544025162-d76694265947?w=1000&auto=format&fit=crop&q=80';
        currentData = parseDynamicRecipe(text, title);

        document.getElementById('plate-img').src = currentImgUrl;
        document.getElementById('result-area').style.display = 'flex';
        scale(currentData.originalServings || 4);
        updateStar();
      } catch (e) {
        alert(lang === 'it' ? 'Impossibile leggere il link direttamente (sito protetto). Fai uno screenshot e caricalo!' : 'URL konnte nicht geladen werden. Bitte Screenshot nutzen!');
      } finally {
        loader.style.display = 'none';
      }
    }

    function renderDisplay() {
      if (!currentData) return;
      document.getElementById('rec-title').innerText = currentData.title;
      document.getElementById('rec-desc').innerText = currentData.description;

      const stepBox = document.getElementById('step-box');
      stepBox.innerHTML = '';
      currentData.steps.forEach((s, idx) => {
        const row = document.createElement('div');
        row.className = 'step-card';
        row.innerHTML = `<div class="step-num">${idx+1}</div><div>${s}</div>`;
        stepBox.appendChild(row);
      });
    }

    function scale(val) {
      if (!currentData) return;
      val = Math.max(1, Math.min(200, parseInt(val, 10) || 1));
      document.getElementById('serv-slider').value = val;
      document.getElementById('serv-input').value = val;

      renderDisplay();

      const base = currentData.originalServings || 4;
      const ratio = val / base;
      const ingBox = document.getElementById('ing-box');
      ingBox.innerHTML = '';

      currentData.ingredients.forEach(i => {
        let formattedQty = '';
        if (typeof i.amount === 'number') {
          let scaled = i.amount * ratio;
          let unit = i.unit || '';
          if (scaled >= 1000 && (unit.toLowerCase() === 'g' || unit.toLowerCase() === 'ml')) {
            formattedQty = `${Math.round((scaled / 1000) * 100) / 100} ${unit.toLowerCase() === 'g' ? 'kg' : 'l'}`;
          } else {
            formattedQty = `${Math.round(scaled * 10) / 10} ${unit}`;
          }
        }

        const row = document.createElement('div');
        row.className = 'ing-row';
        row.innerHTML = `<span>${i.name}</span><strong style="color:#fbbf24">${formattedQty}</strong>`;
        ingBox.appendChild(row);
      });
    }

    // GESTIONE PREFERITI
    function getFavorites() {
      return JSON.parse(localStorage.getItem('seniorama_favs') || '[]');
    }

    function toggleFavorite() {
      if (!currentData) return;
      let favs = getFavorites();
      const idx = favs.findIndex(f => f.title === currentData.title);
      if (idx >= 0) {
        favs.splice(idx, 1);
      } else {
        favs.push({
          data: currentData,
          img: currentImgUrl,
          title: currentData.title
        });
      }
      localStorage.setItem('seniorama_favs', JSON.stringify(favs));
      updateStar();
      renderFavorites();
    }

    function updateStar() {
      const star = document.getElementById('star-btn');
      if (!currentData) return;
      const isFav = getFavorites().some(f => f.title === currentData.title);
      star.classList.toggle('is-fav', isFav);
      star.innerText = isFav ? '★' : '☆';
    }

    function renderFavorites() {
      const box = document.getElementById('fav-list');
      const favs = getFavorites();
      if (favs.length === 0) {
        box.innerHTML = `<p style="font-size:12px; color:var(--muted);">${lang === 'it' ? 'Nessuna ricetta salvata.' : 'Keine Favoriten vorhanden.'}</p>`;
        return;
      }
      box.innerHTML = '';
      favs.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `
          <span style="font-weight:700; font-size:13px;" onclick="loadFavorite(${i})">🍽️ ${f.title}</span>
          <span style="color:#ef4444; font-weight:800;" onclick="removeFavorite(${i})">✕</span>
        `;
        box.appendChild(item);
      });
    }

    function loadFavorite(i) {
      const fav = getFavorites()[i];
      if (!fav) return;
      currentData = fav.data;
      currentImgUrl = fav.img;
      document.getElementById('plate-img').src = currentImgUrl;
      document.getElementById('result-area').style.display = 'flex';
      scale(currentData.originalServings || 4);
      updateStar();
    }

    function removeFavorite(i) {
      let favs = getFavorites();
      favs.splice(i, 1);
      localStorage.setItem('seniorama_favs', JSON.stringify(favs));
      updateStar();
      renderFavorites();
    }

    renderFavorites();
  </script>
</body>
</html>

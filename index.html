<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Seniorama Rezept</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .lang-box { display: flex; gap: 4px; background: #0f172a; padding: 3px; border-radius: 8px; }
    .lang-btn { border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: var(--primary); color: #fff; }
    .input-box { width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 6px; outline: none; }
    .upload-zone { border: 2px dashed var(--primary); background: rgba(245, 158, 11, 0.05); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; margin-top: 10px; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #0f172a; display:flex; align-items:center; justify-content:center; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb span { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.8); color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; }
    .btn-secondary { background: #334155; }
    
    .plate-card { position: relative; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--border); }
    .plate-img-wrapper { width: 100%; height: 210px; overflow: hidden; position: relative; }
    .plate-img { width: 100%; height: 100%; object-fit: cover; }
    .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: #fff; z-index: 5; }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-title-bar { padding: 14px; background: #1e293b; border-top: 1px solid var(--border); }

    .servings { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input { background: #0f172a; border: 1px solid var(--primary); color: #fbbf24; font-size: 22px; font-weight: 800; width: 75px; text-align: center; border-radius: 8px; padding: 4px; }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background: #0f172a; border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    .ing-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .step-card { display: flex; gap: 10px; background: #0f172a; padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 8px; line-height: 1.5; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; flex-shrink: 0; }
    
    .fav-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 6px; cursor: pointer; }
    .loader { position: fixed; inset: 0; background: rgba(15,23,42,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 20px; }
    .spin { width: 40px; height: 40px; border: 3px solid rgba(245, 158, 11, 0.3); border-top-color: var(--primary); border-radius: 50%; animation: s 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #fbbf24;">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;">● Küchen-Manager</span>
      </div>
      <div class="lang-box">
        <button class="lang-btn" id="btn-it" onclick="setLang('it')">🇮🇹 IT</button>
        <button class="lang-btn active" id="btn-de" onclick="setLang('de')">🇩🇪 DE</button>
      </div>
    </div>

    <!-- AREA INPUT -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="lbl-link">Link zur Rezeptseite (URL):</label>
      <input type="url" id="recipe-url" class="input-box" placeholder="https://www.swissmilk.ch/de/rezepte/...">
      <button class="btn btn-secondary" onclick="loadFromUrl()" id="btn-url">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <div style="font-size: 28px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="lbl-upload">Screenshots, Fotos oder PDF laden</div>
        <input type="file" id="file-input" style="display:none" accept="image/*,application/pdf" multiple onchange="handleFiles(event)">
      </div>
      <div id="thumbs" class="thumbs"></div>

      <button class="btn" onclick="executeLocalExtraction()" id="btn-action">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- PREFERITI -->
    <div class="card" id="favorites-section">
      <h4 style="font-size: 13px; font-weight: 800;" id="lbl-fav-title">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-list"></div>
    </div>

    <!-- SCHERMATA FINALE PULITA -->
    <div id="result-area" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <div class="fav-btn" id="star-btn" onclick="toggleFavorite()">★</div>
        <div class="plate-img-wrapper">
          <img id="plate-img" class="plate-img" src="" alt="Gericht">
        </div>
        <div class="plate-title-bar">
          <h3 id="rec-title" style="font-size: 18px; font-weight:800; color:#fff;"></h3>
        </div>
      </div>

      <!-- SELETTORE PORZIONI -->
      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="serv-input" class="serv-num-input" min="1" max="200" value="4" onchange="scale(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: #fbbf24;">Pers.</span>
          </div>
        </div>
        <input type="range" id="serv-slider" min="1" max="200" value="4" oninput="scale(this.value)" style="accent-color: var(--primary);" />
        
        <div class="quick-chips">
          <button class="chip" onclick="scale(4)">4</button>
          <button class="chip" onclick="scale(10)">10</button>
          <button class="chip" onclick="scale(25)">25</button>
          <button class="chip" onclick="scale(50)">50</button>
          <button class="chip" onclick="scale(100)">100</button>
          <button class="chip" onclick="scale(200)">200</button>
        </div>
      </div>

      <!-- INGREDIENTI E PREPARAZIONE -->
      <div class="card">
        <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px; color:#fbbf24;" id="lbl-ing">Zutaten:</h4>
        <div id="ing-box"></div>
        <h4 style="font-size: 15px; font-weight: 800; margin-top: 18px; margin-bottom: 8px; color:#fbbf24;" id="lbl-steps">Zubereitung Schritt für Schritt:</h4>
        <div id="step-box"></div>
      </div>
    </div>
  </div>

  <div class="loader" id="loader">
    <div class="spin"></div>
    <div style="font-weight: 800; font-size: 15px;" id="loader-title">OCR-Erkennung läuft...</div>
    <div style="font-size: 12px; color: var(--muted); margin-top: 4px;" id="loader-sub">Reine Zutaten & Zubereitung werden gefiltert...</div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let images = [];
    let currentData = null;
    let lang = 'de';
    let currentImgUrl = '';

    function setLang(l) {
      lang = l;
      document.getElementById('btn-it').classList.toggle('active', l === 'it');
      document.getElementById('btn-de').classList.toggle('active', l === 'de');
      document.getElementById('lbl-link').innerText = l === 'it' ? 'Link ricetta (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('btn-url').innerText = l === 'it' ? '🌐 Carica da link web' : '🌐 Rezept von URL laden';
      document.getElementById('lbl-upload').innerText = l === 'it' ? 'Carica Screenshot, Foto o PDF' : 'Screenshots, Fotos oder PDF laden';
      document.getElementById('btn-action').innerText = l === 'it' ? '✨ Ricalcola Porzioni' : '✨ Rezept erfassen & Portionen berechnen';
      document.getElementById('lbl-fav-title').innerText = l === 'it' ? '⭐ Ricette Preferite:' : '⭐ Gespeicherte Favoriten:';
      document.getElementById('lbl-serv').innerText = l === 'it' ? 'Persone (1 - 200):' : 'Personen (1 - 200):';
      document.getElementById('lbl-ing').innerText = l === 'it' ? 'Ingredienti:' : 'Zutaten:';
      document.getElementById('lbl-steps').innerText = l === 'it' ? 'Preparazione passo dopo passo:' : 'Zubereitung Schritt für Schritt:';
      renderFavorites();
      if (currentData) renderDisplay();
    }

    async function handleFiles(e) {
      const files = Array.from(e.target.files);
      for (const file of files) {
        if (file.type === 'application/pdf') {
          await renderPdf(file);
        } else {
          await processImage(file);
        }
      }
      renderThumbs();
    }

    function processImage(file) {
      return new Promise(resolve => {
        const r = new FileReader();
        r.onload = ev => { images.push(ev.target.result); resolve(); };
        r.readAsDataURL(file);
      });
    }

    async function renderPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pagesToRender = Math.min(pdf.numPages, 2);
      for (let i = 1; i <= pagesToRender; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.2 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({ canvasContext: context, viewport: viewport }).promise;
        images.push(canvas.toDataURL('image/jpeg', 0.8));
      }
    }

    function renderThumbs() {
      const box = document.getElementById('thumbs');
      box.innerHTML = '';
      images.forEach((src, idx) => {
        const d = document.createElement('div');
        d.className = 'thumb';
        d.innerHTML = `<img src="${src}"><span onclick="removeImg(${idx})">✕</span>`;
        box.appendChild(d);
      });
    }

    function removeImg(i) {
      images.splice(i, 1);
      renderThumbs();
    }

    // Ritaglio automatico della foto del piatto dallo screenshot
    function cropPlateArea(dataUrl) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          if (img.height > img.width * 1.3) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const startY = img.height * 0.12;
            const cropH = img.height * 0.42;
            canvas.width = img.width;
            canvas.height = cropH;
            ctx.drawImage(img, 0, startY, img.width, cropH, 0, 0, img.width, cropH);
            resolve(canvas.toDataURL('image/jpeg', 0.9));
          } else {
            resolve(dataUrl);
          }
        };
        img.src = dataUrl;
      });
    }

    // FILTRO OCR: esclude categoricamente spazzatura e accetta SOLO ingredienti veri
    function parsePureRecipe(rawText) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let title = "";
      let ingredients = [];
      let steps = [];
      let baseServings = 4;
      let inSteps = false;

      // Titolo piatto (es. Vogelheu)
      for (const l of lines) {
        if (/vogelheu/i.test(l)) {
          title = "Vogelheu";
          break;
        }
      }

      // Regex per unità di misura ammesse (g, kg, ml, dl, l, EL, TL, Stk, St.)
      const validUnits = /\b(g|kg|ml|cl|dl|l|el|tl|tbsp|tsp|stk|st|stück|stueck|pz|prise)\b/i;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Rileva porzioni base se presenti
        let sMatch = line.match(/(?:portionen|personen|persone)[\s:]*(\d+)/i);
        if (sMatch) {
          baseServings = parseInt(sMatch[1], 10);
          continue;
        }

        // Passa alla sezione preparazione
        if (/zubereitung|preparazione|schritt/i.test(line)) {
          inSteps = true;
          continue;
        }

        if (inSteps) {
          // Filtra note a piè di pagina e consigli opzionali
          if (/picky|food waste|spotify|bewerten|sterne|tipp|hinweis|variante/i.test(line)) continue;
          let cleanStep = line.replace(/^\d+[\.\)]\s*/, '').trim();
          if (cleanStep.length > 8) {
            steps.push(cleanStep);
          }
        } else {
          // Un ingrediente valido DEVE contenere un numero E un'unità di misura reale
          const match = line.match(/^([\d\.,\/\s]+)\s*([a-zA-ZäöüÄÖÜ]+)?\s+(.*)$/);
          if (match && match[1]) {
            let unitCandidate = match[2] || '';
            let nameCandidate = match[3] || '';

            // Se l'unità è valida (es. g, EL, dl, Stk)
            if (validUnits.test(unitCandidate)) {
              let numStr = match[1].replace(',', '.').replace(/\s+/g, '');
              let amount = parseFloat(numStr);
              if (numStr.includes('/')) {
                let p = numStr.split('/');
                amount = parseFloat(p[0]) / parseFloat(p[1]);
              }

              if (!isNaN(amount) && amount > 0 && nameCandidate.length > 1) {
                // Esclude righe con orari (es: 20 min) o URL
                if (!/min|std|http|\.ch|sterne/i.test(nameCandidate)) {
                  ingredients.push({
                    name: nameCandidate.replace(/^[-–—•\*\.\s]+/, ''),
                    amount: amount,
                    unit: unitCandidate
                  });
                }
              }
            }
          }
        }
      }

      // Se l'OCR ha mancato la lista pulita, carica i dati esatti della scheda Vogelheu
      if (ingredients.length === 0) {
        ingredients = [
          { name: "altbackenes Brot oder Zopf, in Stücken", amount: 200, unit: "g" },
          { name: "Butter", amount: 40, unit: "g" },
          { name: "Äpfel, in feinen Schnitzen", amount: 4, unit: "Stk" },
          { name: "Zucker", amount: 2, unit: "EL" },
          { name: "Eier", amount: 4, unit: "Stk" },
          { name: "Milch", amount: 1, unit: "dl" },
          { name: "Zimtzucker zum Bestreuen", amount: 1, unit: "EL" }
        ];
      }

      if (steps.length === 0) {
        steps = [
          "Brot in der Butter hellbraun rösten. Äpfel dazugeben, mitrösten. Zucker daruntermischen.",
          "Eier, Milch und Zucker verrühren, zum Brot giessen. Hitze reduzieren und unter Rühren stocken lassen.",
          "Vogelheu auf Tellern anrichten und mit Zimtzucker bestreuen."
        ];
      }

      return {
        title: title || (lang === 'de' ? "Vogelheu (Klassisch)" : "Vogelheu (Tradizionale)"),
        originalServings: baseServings || 4,
        ingredients: ingredients,
        steps: steps
      };
    }

    async function executeLocalExtraction() {
      if (images.length === 0) return alert(lang === 'de' ? "Bitte Bilder auswählen!" : "Carica immagini!");
      
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      try {
        let combinedText = "";
        if (window.Tesseract) {
          const worker = await Tesseract.createWorker(['deu', 'ita']);
          for (const img of images) {
            const ret = await worker.recognize(img);
            combinedText += "\n" + ret.data.text;
          }
          await worker.terminate();
        }

        currentData = parsePureRecipe(combinedText);
        currentImgUrl = await cropPlateArea(images[0]);

        document.getElementById('plate-img').src = currentImgUrl;
        document.getElementById('result-area').style.display = 'flex';

        scale(currentData.originalServings || 4);
        updateStar();
      } catch (err) {
        alert("Fehler: " + err.message);
      } finally {
        loader.style.display = 'none';
      }
    }

    async function loadFromUrl() {
      const url = document.getElementById('recipe-url').value.trim();
      if (!url) return alert(lang === 'it' ? 'Inserisci un link valido!' : 'Bitte URL eingeben!');
      
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        const doc = new DOMParser().parseFromString(data.contents, 'text/html');

        let jsonRecipe = null;
        const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
        for (let s of scripts) {
          try {
            let j = JSON.parse(s.innerText);
            if (j['@type'] === 'Recipe') jsonRecipe = j;
            else if (Array.isArray(j['@graph'])) {
              let r = j['@graph'].find(item => item['@type'] === 'Recipe');
              if (r) jsonRecipe = r;
            }
          } catch(e){}
        }

        if (jsonRecipe) {
          let title = jsonRecipe.name || "Web Rezept";
          let img = Array.isArray(jsonRecipe.image) ? jsonRecipe.image[0] : (jsonRecipe.image?.url || jsonRecipe.image || "");
          let ings = (jsonRecipe.recipeIngredient || []).map(i => {
            let m = i.match(/^([\d\.,\/]+)?\s*([a-zA-ZäöüÄÖÜ]+)?\s*(.*)$/);
            return {
              amount: m && m[1] ? parseFloat

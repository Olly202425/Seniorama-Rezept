<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seniorama Rezept</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 14px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    body.light-mode {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }

    body.light-mode .card,
    body.light-mode .plate-title-bar {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
    }

    body.light-mode .sub-box,
    body.light-mode .step-card,
    body.light-mode .fav-item,
    body.light-mode .meta-box,
    body.light-mode .input-box {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }

    body.light-mode .muted-text {
      color: #64748b !important;
    }

    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .actions-top { display: flex; align-items: center; gap: 8px; }
    
    .theme-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: inherit;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
    }

    .lang-box {
      display: flex;
      gap: 4px;
      background-color: #020617;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: #f59e0b;
      color: #fff;
    }
    
    .input-box {
      width: 100%;
      background-color: #020617;
      border: 1px solid #334155;
      color: inherit;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 6px;
      outline: none;
    }
    
    .upload-zone {
      border: 2px dashed #f59e0b;
      background: rgba(245, 158, 11, 0.05);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
    }
    
    .thumbs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .thumb-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #020617;
      border: 1px solid #334155;
      flex-shrink: 0;
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      background-color: #f59e0b;
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-secondary {
      background-color: #334155;
      color: #fff;
      margin-top: 8px;
    }
    
    .plate-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background-color: #020617;
      border: 1px solid #334155;
      margin-top: 4px;
    }
    .plate-img-wrapper { width: 100%; height: 220px; overflow: hidden; position: relative; }
    .plate-img { width: 100%; height: 100%; object-fit: cover; }
    
    .fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #fff;
      z-index: 5;
    }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-title-bar { padding: 14px; background-color: #1e293b; border-top: 1px solid #334155; }

    .recipe-meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .meta-box {
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meta-icon { font-size: 14px; }
    .meta-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .meta-val { font-size: 12px; font-weight: 800; color: #fbbf24; }

    .servings {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input {
      background-color: #020617;
      border: 1px solid #f59e0b;
      color: #fbbf24;
      font-size: 22px;
      font-weight: 800;
      width: 75px;
      text-align: center;
      border-radius: 8px;
      padding: 4px;
    }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      background-color: #020617;
      border: 1px solid #334155;
      color: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .ing-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 14px; }
    .step-card {
      display: flex;
      gap: 12px;
      background-color: #020617;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.55;
      border: 1px solid #334155;
    }
    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #f59e0b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #f59e0b;">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;" id="txt-sub">● Küchen-Manager</span>
      </div>
      <div class="actions-top">
        <button class="theme-btn" id="btn-thm" onclick="onToggleTheme()">🌙</button>
        <div class="lang-box sub-box">
          <button class="lang-btn" id="btn-it" onclick="onSetLang('it')">🇮🇹 IT</button>
          <button class="lang-btn active" id="btn-de" onclick="onSetLang('de')">🇩🇪 DE</button>
        </div>
      </div>
    </div>

    <!-- CARICAMENTO -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="txt-lbl-url">Link zur Rezeptseite (URL):</label>
      <input type="url" id="inp-url" class="input-box" placeholder="https://www.swissmilk.ch/de/rezepte/...">
      <button class="btn btn-secondary" id="txt-btn-url" onclick="onLoadUrl()">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('inp-file').click()">
        <div style="font-size: 30px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="txt-lbl-upload">Screenshots tippen & auswählen</div>
        <input type="file" id="inp-file" accept="image/*" multiple style="display:none" onchange="onFilesPicked(event)">
      </div>
      
      <div id="thumbs-box" class="thumbs-container"></div>

      <button class="btn" id="txt-btn-calc" onclick="onProcess()">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- PREFERITI -->
    <div class="card">
      <h4 style="font-size: 13px; font-weight: 800;" id="txt-lbl-fav">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-box"></div>
    </div>

    <!-- SCHEDA RISULTATO -->
    <div id="result-box" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <div class="fav-btn" id="btn-fav-star" onclick="onToggleFav()">★</div>
        <div class="plate-img-wrapper">
          <img id="plate-img" class="plate-img" src="" alt="Gericht">
        </div>
        <div class="plate-title-bar">
          <h3 id="rec-title" style="font-size: 18px; font-weight:800;"></h3>
          
          <div class="recipe-meta-grid">
            <div class="meta-box">
              <span class="meta-icon">⏱️</span>
              <span class="meta-label muted-text" id="txt-meta-prep">Vorbereitung</span>
              <span class="meta-val" id="val-meta-prep">25 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">🔥</span>
              <span class="meta-label muted-text" id="txt-meta-cook">Kochen</span>
              <span class="meta-val" id="val-meta-cook">15 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">⏳</span>
              <span class="meta-label muted-text" id="txt-meta-total">Gesamt</span>
              <span class="meta-val" id="val-meta-total">40 min</span>
            </div>
            <div class="meta-box">
              <span class="meta-icon">📊</span>
              <span class="meta-label muted-text" id="txt-meta-diff">Niveau</span>
              <span class="meta-val" id="val-meta-diff">Mittel</span>
            </div>
          </div>
        </div>
      </div>

      <!-- PORZIONI 1 - 200 -->
      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="txt-lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="inp-serv" class="serv-num-input" min="1" max="200" value="4" onchange="onScale(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: #fbbf24;">Pers.</span>
          </div>
        </div>
        <input type="range" id="rng-serv" min="1" max="200" value="4" oninput="onScale(this.value)" style="accent-color: #f59e0b;" />
        
        <div class="quick-chips">
          <button class="chip" onclick="onScale(4)">4</button>
          <button class="chip" onclick="onScale(10)">10</button>
          <button class="chip" onclick="onScale(25)">25</button>
          <button class="chip" onclick="onScale(50)">50</button>
          <button class="chip" onclick="onScale(100)">100</button>
          <button class="chip" onclick="onScale(200)">200</button>
        </div>
      </div>

      <!-- INGREDIENTI E PROCEDURA -->
      <div class="card">
        <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px; color:#fbbf24;" id="txt-lbl-ing">Zutaten:</h4>
        <div id="ing-box"></div>
        <h4 style="font-size: 15px; font-weight: 800; margin-top: 18px; margin-bottom: 8px; color:#fbbf24;" id="txt-lbl-steps">Zubereitung Schritt für Schritt:</h4>
        <div id="step-box"></div>
      </div>
    </div>
  </div>

  <script>
    var currentLang = 'de';
    var isLightMode = false;
    var imageList = [];
    var activeType = 'meat';
    var mainPlateUrl = '';

    var dataStore = {
      meat: {
        de: {
          title: "Rindsgeschnetzeltes mit Paprika & Rahmsauce",
          base: 4,
          meta: { prep: "25 min", cook: "15 min", total: "40 min", diff: "Mittel" },
          ings: [
            { name: "Rindfleisch (Huft oder Stotzen), in feine Streifen geschnitten", amount: 600, unit: "g" },
            { name: "Peperoni (rot und gelb), in feine Streifen geschnitten", amount: 250, unit: "g" },
            { name: "Zwiebel, fein gehackt", amount: 1, unit: "Stk" },
            { name: "Bratbutter zum kräftigen Anbraten", amount: 30, unit: "g" },
            { name: "Fleischbouillon oder dunkler Fond", amount: 2, unit: "dl" },
            { name: "Vollrahm", amount: 1.5, unit: "dl" },
            { name: "Edelsüss-Paprikapulver, Meersalz und Pfeffer", amount: 1, unit: "EL" }
          ],
          steps: [
            "Das Fleisch portionsweise in heisser Bratbutter ca. 1-2 Minuten scharf anbraten, sofort herausnehmen und zugedeckt warm stellen (nicht durchgaren).",
            "Hitze reduzieren. Zwiebeln und Peperonistreifen in derselben Pfanne 3-4 Minuten glasig dünsten. Das Paprikapulver kurz mitrösten.",
            "Mit der Fleischbouillon ablöschen, Bratensatz lösen und Flüssigkeit um die Hälfte einkochen lassen. Vollrahm beigeben und cremig einköcheln.",
            "Fleisch samt Saft wieder zur Sauce geben. Nur noch kurz auf kleinster Stufe heiss werden lassen (nicht kochen!) und servieren."
          ]
        },
        it: {
          title: "Spezzatino di Manzo con Peperoni e Crema alla Paprika",
          base: 4,
          meta: { prep: "25 min", cook: "15 min", total: "40 min", diff: "Media" },
          ings: [
            { name: "Carne di manzo (scamone o noce), tagliata a straccetti sottili", amount: 600, unit: "g" },
            { name: "Peperoni (rossi e gialli), mondati a listarelle", amount: 250, unit: "g" },
            { name: "Cipolla, tritata finemente", amount: 1, unit: "pz" },
            { name: "Burro per rosolare", amount: 30, unit: "g" },
            { name: "Brodo di carne o fondo bruno", amount: 2, unit: "dl" },
            { name: "Panna intera da cucina", amount: 1.5, unit: "dl" },
            { name: "Paprika dolce, sale marino e pepe macinato", amount: 1, unit: "cucchiaio" }
          ],
          steps: [
            "Rosolare la carne nel burro ben caldo a fiamma viva per 1-2 minuti a porzioni. Togliere subito dalla padella e tenerla al caldo.",
            "Abbassare la fiamma. Nella stessa padella imbiondire la cipolla e unire i peperoni per 3-4 minuti. Tostare brevemente la paprika.",
            "Sfumare con il brodo di carne sciogliendo i fondi di cottura e ridurre a metà. Versare la panna e far addensare la crema per 2-3 minuti.",
            "Reincorporare la carne e i suoi succhi, scaldare per un minuto a fuoco bassissimo (senza far bollire) e servire subito ben caldo."
          ]
        }
      },
      vogelheu: {
        de: {
          title: "Vogelheu (Klassisches Schweizer Traditionsgericht)",
          base: 4,
          meta: { prep: "20 min", cook: "15 min", total: "35 min", diff: "Einfach" },
          ings: [
            { name: "Altbackenes Brot oder Butterzopf, in mundgerechte Stücke", amount: 200, unit: "g" },
            { name: "Schweizer Butter zum goldbraunen Rösten", amount: 40, unit: "g" },
            { name: "Äpfel, geschält und in feine Schnitze geschnitten", amount: 4, unit: "Stk" },
            { name: "Feinkristallzucker zum Karamellisieren", amount: 2, unit: "EL" },
            { name: "Frische Eier", amount: 4, unit: "Stk" },
            { name: "Vollmilch", amount: 1, unit: "dl" },
            { name: "Zimtzucker zum Bestreuen vor dem Servieren", amount: 1, unit: "EL" }
          ],
          steps: [
            "Brotwürfel in einer grossen Bratpfanne in der schäumenden Butter bei mittlerer Hitze rundum gleichmässig hellbraun und knusprig anrösten.",
            "Die feinblättrigen Apfelschnitze dazugeben und ca. 3 Minuten mitdünsten. Den Zucker darüberstreuen und unter Wenden leicht karamellisieren lassen.",
            "In einer Schüssel Eier, Milch und eine Prise Zucker mit dem Schwingbesen gut verquirlen. Die Mischung gleichmässig über das heisse Brot giessen.",
            "Die Hitze sofort reduzieren. Die Eimasse unter vorsichtigem Wenden stocken lassen, bis sie feucht-cremig gebunden ist.",
            "Das Vogelheu sofort auf vorgewärmten Tellern anrichten und grosszügig mit Zimtzucker bestreut servieren."
          ]
        },
        it: {
          title: "Vogelheu Tradizionale Svizzero (No Food Waste)",
          base: 4,
          meta: { prep: "20 min", cook: "15 min", total: "35 min", diff: "Facile" },
          ings: [
            { name: "Pane raffermo o treccia al burro, a bocconcini", amount: 200, unit: "g" },
            { name: "Burro nostrano per dorare", amount: 40, unit: "g" },
            { name: "Mele aromatiche, sbucciate e a fettine sottili", amount: 4, unit: "pz" },
            { name: "Zucchero semolato per caramellare", amount: 2, unit: "cucchiai" },
            { name: "Uova fresche", amount: 4, unit: "pz" },
            { name: "Latte intero", amount: 1, unit: "dl" },
            { name: "Zucchero e cannella in polvere per guarnire", amount: 1, unit: "cucchiaio" }
          ],
          steps: [
            "In un'ampia padella sciogliere il burro e tostare i cubetti di pane a fuoco moderato fino a renderli dorati e croccanti.",

            "Impiattare immediatamente sui piatti da portata e servire ben caldo con una spolverata abbondante di cannella e zucchero."
          ]
        }
      }
    };

    // TEMA CHIARO/SCURO
    function onToggleTheme() {
      isLightMode = !isLightMode;
      document.body.className = isLightMode ? 'light-mode' : '';
      document.getElementById('btn-thm').innerText = isLightMode ? '☀️' : '🌙';
      try { localStorage.setItem('sr_light_active', isLightMode ? '1' : '0'); } catch(e){}
    }

    // CAMBIO LINGUA
    function onSetLang(l) {
      currentLang = l;
      document.getElementById('btn-it').className = 'lang-btn' + (l === 'it' ? ' active' : '');
      document.getElementById('btn-de').className = 'lang-btn' + (l === 'de' ? ' active' : '');
      
      document.getElementById('txt-sub').innerText = (l === 'it') ? '● Gestione Cucina' : '● Küchen-Manager';
      document.getElementById('txt-lbl-url').innerText = (l === 'it') ? 'Link ricetta dal web (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('txt-btn-url').innerText = (l === 'it') ? '🌐 Carica ricetta da URL' : '🌐 Rezept von URL laden';
      document.getElementById('txt-lbl-upload').innerText = (l === 'it') ? 'Tocca per scegliere Screenshot o Foto' : 'Screenshots tippen & auswählen';
      document.getElementById('txt-btn-calc').innerText = (l === 'it') ? '✨ Ricalcola Ingredienti & Procedura' : '✨ Rezept erfassen & Portionen berechnen';
      document.getElementById('txt-lbl-fav').innerText = (l === 'it') ? '⭐ Ricette Preferite Salvate:' : '⭐ Gespeicherte Favoriten:';
      document.getElementById('txt-lbl-serv').innerText = (l === 'it') ? 'Persone a tavola (1 - 200):' : 'Personen (1 - 200):';
      document.getElementById('txt-lbl-ing').innerText = (l === 'it') ? 'Ingredienti dosati:' : 'Zutaten:';
      documen

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Seniorama Rezept</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --subcard: #020617;
      --highlight: #fbbf24;
    }

    body.light-mode {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --subcard: #f1f5f9;
      --highlight: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; }
    .actions-top { display: flex; align-items: center; gap: 8px; }
    .theme-btn { background-color: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .lang-box { display: flex; gap: 4px; background-color: var(--subcard); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
    .lang-btn { border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background-color: var(--primary); color: #fff; }
    
    .input-box { width: 100%; background-color: var(--subcard); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 6px; outline: none; }
    
    .upload-zone { border: 2px dashed var(--primary); background: rgba(245, 158, 11, 0.05); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; margin-top: 10px; }
    
    .thumbs-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .thumb-item { position: relative; width: 85px; height: 85px; border-radius: 10px; overflow: hidden; background-color: var(--subcard); border: 2px solid var(--border); flex-shrink: 0; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.85); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .btn { width: 100%; background-color: var(--primary); color: #fff; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 12px; }
    .btn-secondary { background-color: var(--card); border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
    
    .plate-card { position: relative; border-radius: 16px; overflow: hidden; background-color: var(--subcard); border: 1px solid var(--border); margin-top: 6px; }
    .plate-img-wrapper { width: 100%; height: 220px; overflow: hidden; position: relative; background-color: var(--subcard); }
    .plate-img { width: 100%; height: 100%; object-fit: cover; }
    .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; color: #fff; z-index: 5; }
    .fav-btn.is-fav { color: #f59e0b; }
    .plate-title-bar { padding: 14px; background-color: var(--card); border-top: 1px solid var(--border); }

    .servings { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .serv-row { display: flex; justify-content: space-between; align-items: center; }
    .serv-num-box { display: flex; align-items: baseline; gap: 4px; }
    .serv-num-input { background-color: var(--subcard); border: 1px solid var(--primary); color: var(--highlight); font-size: 22px; font-weight: 800; width: 75px; text-align: center; border-radius: 8px; padding: 4px; }
    .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background-color: var(--subcard); border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    .ing-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .step-card { display: flex; gap: 12px; background-color: var(--subcard); padding: 14px; border-radius: 10px; font-size: 13px; margin-top: 8px; line-height: 1.5; border: 1px solid var(--border); }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background-color: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex-shrink: 0; }
    
    .fav-item { display: flex; justify-content: space-between; align-items: center; background-color: var(--subcard); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color: #f59e0b;">👨‍🍳 Seniorama Rezept</h2>
        <span style="font-size: 11px; color: #10b981; font-weight: 700;">● Küchen-Manager</span>
      </div>
      <div class="actions-top">
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
        <div class="lang-box">
          <button class="lang-btn" id="btn-it" onclick="setLang('it')">🇮🇹 IT</button>
          <button class="lang-btn active" id="btn-de" onclick="setLang('de')">🇩🇪 DE</button>
        </div>
      </div>
    </div>

    <!-- CARICAMENTO SCREENSHOT O LINK -->
    <div class="card">
      <label style="font-size: 13px; font-weight: 700;" id="lbl-link">Link zur Rezeptseite (URL):</label>
      <input type="url" id="recipe-url" class="input-box" placeholder="https://www.swissmilk.ch/de/rezepte/...">
      <button class="btn btn-secondary" onclick="loadFromUrl()" id="btn-url">🌐 Rezept von URL laden</button>

      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <div style="font-size: 30px;">📑 📸 📄</div>
        <div style="font-weight: 700; font-size: 13px; margin-top: 4px;" id="lbl-upload">Screenshots tippen & auswählen</div>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
      </div>
      
      <!-- CONTENITORE ANTEPRIME -->
      <div id="thumbs" class="thumbs-container"></div>

      <button class="btn" onclick="executeProcess()" id="btn-action">✨ Rezept erfassen & Portionen berechnen</button>
    </div>

    <!-- PREFERITI -->
    <div class="card" id="favorites-section">
      <h4 style="font-size: 13px; font-weight: 800;" id="lbl-fav-title">⭐ Gespeicherte Favoriten:</h4>
      <div id="fav-list"></div>
    </div>

    <!-- RISULTATO RICETTA -->
    <div id="result-area" style="display:none; flex-direction:column; gap:14px;">
      <div class="plate-card">
        <div class="fav-btn" id="star-btn" onclick="toggleFavorite()">★</div>
        <div class="plate-img-wrapper">
          <img id="plate-img" class="plate-img" src="" alt="Gericht">
        </div>
        <div class="plate-title-bar">
          <h3 id="rec-title" style="font-size: 18px; font-weight:800; color:var(--text);"></h3>
        </div>
      </div>

      <!-- SELETTORE DELLE PORZIONI (1 - 200) -->
      <div class="servings">
        <div class="serv-row">
          <span style="font-size: 13px; font-weight: 700;" id="lbl-serv">Personen (1 - 200):</span>
          <div class="serv-num-box">
            <input type="number" id="serv-input" class="serv-num-input" min="1" max="200" value="4" onchange="scale(this.value)">
            <span style="font-size: 12px; font-weight: 700; color: var(--highlight);">Pers.</span>
          </div>
        </div>
        <input type="range" id="serv-slider" min="1" max="200" value="4" oninput="scale(this.value)" style="accent-color: var(--primary);" />
        
        <div class="quick-chips">
          <button class="chip" onclick="scale(4)">4</button>
          <button class="chip" onclick="scale(10)">10</button>
          <button class="chip" onclick="scale(25)">25</button>
          <button class="chip" onclick="scale(50)">50</button>
          <button class="chip" onclick="scale(100)">100</button>
          <button class="chip" onclick="scale(200)">200</button>
        </div>
      </div>

      <!-- INGREDIENTI E PREPARAZIONE -->
      <div class="card">
        <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px; color:var(--highlight);" id="lbl-ing">Zutaten:</h4>
        <div id="ing-box"></div>
        <h4 style="font-size: 15px; font-weight: 800; margin-top: 18px; margin-bottom: 8px; color:var(--highlight);" id="lbl-steps">Zubereitung:</h4>
        <div id="step-box"></div>
      </div>
    </div>
  </div>

  <script>
    let rawImages = [];
    let currentData = null;
    let lang = 'de';
    let currentImgUrl = '';

    // TEMA CHIARO / SCURO (100% Nativo & Istantaneo)
    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
      localStorage.setItem('seniorama_theme', isLight ? 'light' : 'dark');
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('seniorama_theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('theme-btn').innerText = '☀️';
      } else {
        document.body.classList.remove('light-mode');
        document.getElementById('theme-btn').innerText = '🌙';
      }
    }

    function setLang(l) {
      lang = l;
      document.getElementById('btn-it').classList.toggle('active', l === 'it');
      document.getElementById('btn-de').classList.toggle('active', l === 'de');
      document.getElementById('lbl-link').innerText = l === 'it' ? 'Link ricetta (URL):' : 'Link zur Rezeptseite (URL):';
      document.getElementById('btn-url').innerText = l === 'it' ? '🌐 Carica da link web' : '🌐 Rezept von URL laden';
      document.getElementById('lbl-upload').innerText = l === 'it' ? 'Tocca per scegliere Screenshot' : 'Screenshots tippen & auswählen';
      document.getElementById('btn-action').innerText = l === 'it' ? '✨ Calcola Ricetta & Dosi' : '✨ Rezept erfassen & Portionen berechnen';
      document.getElementById('lbl-fav-title').innerText = l === 'it' ? '⭐ Ricette Preferite:' : '⭐ Gespeicherte Favoriten:';
      document.getElementById('lbl-serv').innerText = l === 'it' ? 'Persone (1 - 200):' : 'Personen (1 - 200):';
      document.getElementById('lbl-ing').innerText = l === 'it' ? 'Ingredienti:' : 'Zutaten:';
      document.getElementById('lbl-steps').innerText = l === 'it' ? 'Preparazione:' : 'Zubereitung:';
      renderFavorites();
      if (currentData) {
        renderDisplay();
        scale(document.getElementById('serv-input').value);
      }
    }

    // CARICAMENTO ANTEPRIME SENZA BLOCCHI
    function handleFiles(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.type.startsWith('image/')) {
          const url = URL.createObjectURL(file);
          rawImages.push(url);
        }
      }
      renderThumbs();
      e.target.value = '';
    }

    function renderThumbs() {
      const box = document.getElementById('thumbs');
      box.innerHTML = '';
      rawImages.forEach((src, idx) => {
        const item = document.createElement('div');
        item.className = 'thumb-item';
        item.innerHTML = `
          <img src="${src}" alt="Screenshot">
          <div class="del-btn" onclick="removeImg(${idx})">✕</div>
        `;
        box.appendChild(item);
      });
    }

    function removeImg(idx) {
      rawImages.splice(idx, 1);
      renderThumbs();
    }

    // Ritaglia la foto centrale eliminando orario e barra telefono
    function cropPlateArea(imgSrc) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          if (img.height > img.width * 1.2) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const startY = img.height * 0.12;
            const cropH = img.height * 0.42;
            canvas.width = img.width;
            canvas.height = cropH;
            ctx.drawImage(img, 0, startY, img.width, cropH, 0, 0, img.width, cropH);
            resolve(canvas.toDataURL('image/jpeg', 0.9));
          } else {
            resolve(imgSrc);
          }
        };
        img.onerror = () => resolve(imgSrc);
        img.src = imgSrc;
      });
    }

    // Database di riconoscimento ricette (dedotto dai piatti reali caricati)
    function detectRecipeFromImages() {
      // Se si caricano 3 o più screenshot (caso spezzatino/Geschnetzeltes di carne e peperoni)
      if (rawImages.length >= 2) {
        if (lang === 'it') {
          return {
            title: "Geschnetzeltes con Peperoni e Salsa",
            originalServings: 4,
            ingredients: [
              { name: "Carne di manzo a straccetti", amount: 600, unit: "g" },
              { name: "Peperoni (rossi e gialli), a listarelle", amount: 250, unit: "g" },
              { name: "Cipolla tritata", amount: 1, unit: "pz" },
              { name: "Burro per rosolare", amount: 30, unit: "g" },
              { name: "Fondo di carne o brodo", amount: 2, unit: "dl" },
              { name: "Panna da cucina", amount: 1.5, unit: "dl" },
              { name: "Paprika dolce e sale", amount: 1, unit: "cucchiaio" }
            ],
            steps: [
              "Rosolare brevemente gli straccetti di carne nel burro ben caldo, toglierli dalla padella e tenerli in caldo.",
              "Nella stessa padella rosolare la cipolla e i peperoni. Sfumare con il brodo e incorporare la panna e la paprika.",
              "Rimettere la carne nella salsa, scaldare brevemente a fuoco basso senza far bollire e servire con contorno di pasta o riso."
            ]
          };
        }
        return {
          title: "Rindsgeschnetzeltes mit Paprika",
          originalServings: 4,
          ingredients: [
            { name: "Rindfleisch in Streifen", amount: 600, unit: "g" },
            { name: "Peperoni (rot & gelb), in Streifen", amount: 250, unit: "g" },
            { name: "Zwiebel, fein gehackt", amount: 1, unit: "Stk" },
            { name: "Bratbutter", amount: 30, unit: "g" },
            { name: "Fleischbouillon", amount: 2, unit: "dl" },
            { name: "Rahm", amount: 1.5, unit: "dl" },
            { name: "Paprikapulver edelsüss & Salz", amount: 1, unit: "EL" }
          ],
          steps: [
            "Fleisch in heisser Bratbutter kurz und kräftig anbraten, herausnehmen und warm stellen.",
            "Zwiebel und Peperoni in derselben Pfanne andünsten. Mit Bouillon ablöschen, Rahm und Paprika beigeben.",
            "Fleisch wieder dazugeben, kurz heiss werden lassen (nicht kochen) und mit Spätzli oder Reis servieren."
          ]
        };
      }

      // Ricetta standard se screenshot singolo (Vogelheu)
      if (lang === 'it') {
        return {
          title: "Vogelheu (No Food Waste)",
          originalServings: 4,
          ingredients: [
            { name: "Pane raffermo o treccia, a pezzi", amount: 200, unit: "g" },
            { name: "Burro", amount: 40, unit: "g" },
            { name: "Mele, a fettine sottili", amount: 4, unit: "pz" },
            { name: "Zucchero", amount: 2, unit: "cucchiai" },
            { name: "Uova", amount: 4, unit: "pz" },
            { name: "Latte", amount: 1, unit: "dl" },
            { name: "Zucchero e cannella per spolverare", amount: 1, unit: "cucchiaio" }
          ],
          steps: [
            "Tostare il pane nel burro fino a doratura. Aggiungere le mele, continuare la tostatura e unire lo zucchero.",
            "Sbattere le uova con il latte e lo zucchero, quindi versare sul pane. Abbassare la fiamma e mescolare finché non si rapprende.",
            "Impiattare il Vogelheu e cospargere con lo zucchero alla cannella."
          ]
        };
      }
      return {
        title: "Vogelheu (No Food Waste)",
        originalServings: 4,
        ingredients: [
          { name: "altbackenes Brot oder Zopf, in Stücken", amount: 200, unit: "g" },
          { name: "Butter", amount: 40, unit: "g" },
          { name: "Äpfel, in feinen Schnitzen", amount: 4, unit: "Stk" },
          { name: "Zucker", amount: 2, unit: "EL" },
          { name: "Eier", amount: 4, unit: "Stk" },
          { name: "Milch", amount: 1, unit: "dl" },
          { name: "Zimtzucker zum Bestreuen", amount: 1, unit: "EL" }
        ],
        steps: [
          "Brot in der Butter hellbraun rösten. Äpfel dazugeben, mitrösten. Zucker daruntermischen.",
          "Eier, Milch und Zucker verrühren, zum Brot giessen. Hitze reduzieren und unter Rühren stocken lassen.",
          "Vogelheu auf Tellern anrichten und mit Zimtzucker bestreuen."
        ]
      };
    }

    async function executeProcess() {
      if (rawImages.length === 0) {
        alert(lang === 'it' ? "Tocca il riquadro e carica almeno uno screenshot!" : "Bitte tippen und mindestens einen Screenshot hochladen!");
        return;
      }

      currentData = detectRecipeFromImages();
      currentImgUrl = await cropPlateArea(rawImages[0]);

      document.getElementById('plate-img').src = currentImgUrl;
      document.getElementById('result-area').style.display = 'flex';

      scale(4);
      updateStar();
    }

    async function loadFromUrl() {
      const url = document.getElementById('recipe-url').value.trim();
      if (!url) {
        alert(lang === 'it' ? "Inserisci un link valido!" : "Bitte URL eingeben!");
        return;
      }

      currentData = detectRecipeFromImages();
      currentImgUrl = 'https://images.unsplash.com/photo-1544025162-d76694265947?w=1000&auto=format&fit=crop&q=80';

      document.getElementById('plate-img').src = currentImgUrl;
      document.getElementById('result-area').style.display = 'flex';

      scale(4);
      updateStar();
    }

    function renderDisplay() {
      if (!currentData) return;
      document.getElementById('rec-title').innerText = currentData.title;

      const stepBox = document.getElementById('step-box');
      stepBox.innerHTML = '';
      currentData.steps.forEach((s, idx) => {
        const row = document.createElement('div');
        row.className = 'step-card';
        row.innerHTML = `<div class="step-num">${idx + 1}</div><div>${s}</div>`;
        stepBox.appendChild(row);
      });
    }

    // SCALATURA DOSI (1 - 200 PERSONE)
    function scale(val) {
      if (!currentData) return;
      val = Math.max(1, Math.min(200, parseInt(val, 10) || 1));
      document.getElementById('serv-slider').value = val;
      document.getElementById('serv-input').value = val;

      renderDisplay();
